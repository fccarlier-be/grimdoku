# votes de difficulté (/note?g=<énigme>&d=<0-5>&v=<joueur anonyme>&s=<résolue>&n=<taille>) : une ligne par vote
log_format grimdoku_notes '$time_iso8601 $arg_g $arg_d $arg_v $arg_s $arg_n';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # la page change à chaque version : pas de cache navigateur
  # (un add_header dans un location annule ceux du server : on les répète)
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }
  location / { try_files $uri $uri/ /index.html; }
  # note de difficulté envoyée par l'appli : réponse vide, le vote est inscrit dans le journal (tools/notes.sh)
  location = /note {
    access_log /var/log/grimdoku/notes.log grimdoku_notes;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    return 204;
  }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  gzip on;
  gzip_types text/css application/javascript application/json;
}
