# votes de difficulté (/note?g=<énigme>&d=<0-5>&v=<joueur anonyme>&s=<résolue>&n=<taille>) : une ligne par vote
log_format grimdoku_notes '$time_iso8601 $arg_g $arg_d $arg_v $arg_s $arg_n';

# sauvegarde en ligne : au plus 60 requêtes par minute et par joueur (adresse transmise par Cloudflare)
limit_req_zone $http_cf_connecting_ip zone=grimdoku_api:1m rate=60r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # la page change à chaque version : pas de cache navigateur
  # (un add_header dans un location annule ceux du server : on les répète)
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }
  location / { try_files $uri $uri/ /index.html; }
  # note de difficulté envoyée par l'appli : réponse vide, le vote est inscrit dans le journal (tools/notes.sh)
  location = /note {
    access_log /var/log/grimdoku/notes.log grimdoku_notes;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    return 204;
  }

  # relecture des épilogues (révèle les coupables) : mot de passe, relais vers le conteneur grimdoku-epi.
  # Le nom est résolu à la requête (resolver Docker) : si grimdoku-epi est arrêté, seul /epi/ répond une erreur,
  # le jeu continue de fonctionner.
  location = /epi { return 301 /epi/; }
  location /epi/ {
    auth_basic "Relecture Grimdoku";
    auth_basic_user_file /etc/nginx/epi.htpasswd;
    resolver 127.0.0.11 valid=30s;
    set $epi grimdoku-epi:8096;
    rewrite ^/epi/(.*)$ /$1 break;
    proxy_pass http://$epi;
    client_max_body_size 4m;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    add_header X-Robots-Tag "noindex, nofollow";
  }

  # sauvegarde de la progression (compte Google) : relais vers le conteneur grimdoku-api (résolu à la requête, comme /epi/)
  location /api/ {
    limit_req zone=grimdoku_api burst=30 nodelay;
    resolver 127.0.0.11 valid=30s;
    set $api grimdoku-api:8097;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api;
    client_max_body_size 1m;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    add_header X-Robots-Tag "noindex, nofollow";
  }

  absolute_redirect off;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  gzip on;
  gzip_types text/css application/javascript application/json;
}
