services:
  grimdoku:
    image: nginx:1.27-alpine
    container_name: grimdoku
    restart: unless-stopped
    # Pas de "ports" : uniquement joignable par cloudflared, sur le réseau Docker
    # serveur_default (Zero Trust → tunnel vps-ovh → http://grimdoku:80).
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/grimdoku   # journal des votes de difficulté (notes.log), gardé hors du conteneur
      - ./epi.htpasswd:/etc/nginx/epi.htpasswd:ro   # mot de passe de la relecture des épilogues (/epi/)
    networks:
      - serveur_default

  # Relecture des épilogues (grimdoku.fcold.org/epi, derrière nginx et un mot de passe) : tools/relecture.js en mode
  # serveur. Pas de "ports" : seul nginx le joint, sur le réseau Docker. Les épilogues modifiés en ligne sont dans
  # ./epi/data (jamais écrasé par une mise en ligne) ; ./epi/app est remplacé à chaque mise en ligne (tools/epi-pack.js).
  grimdoku-epi:
    image: node:22-alpine
    container_name: grimdoku-epi
    restart: unless-stopped
    command: ["node", "/app/relecture.js"]
    environment:
      - EPI_BUNDLE=/app/bundle.json
      - EPI_SEED=/app/seed
      - EPI_DATA=/data
      - HOST=0.0.0.0
      - PORT=8096
    volumes:
      - ./epi/app:/app:ro
      - ./epi/data:/data
    networks:
      - serveur_default

  # Sauvegarde en ligne de la progression (compte Google) : api/server.js, joint par nginx (/api/), sans port. Données
  # (progressions, secret des sessions) dans ./api-data, jamais envoyé ni écrasé par une mise en ligne.
  grimdoku-api:
    image: node:22-alpine
    container_name: grimdoku-api
    restart: unless-stopped
    command: ["node", "/app/server.js"]
    environment:
      - API_DATA=/data
      - API_CONFIG=/app/config.json
      - HOST=0.0.0.0
      - PORT=8097
    volumes:
      - ./api:/app:ro
      - ./api-data:/data
    networks:
      - serveur_default

networks:
  serveur_default:
    external: true   # réseau de ~/serveur/docker-compose.yml, où tourne cloudflared
