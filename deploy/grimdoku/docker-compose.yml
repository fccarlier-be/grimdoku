services:
  grimdoku:
    image: nginx:1.27-alpine
    container_name: grimdoku
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:80"   # accessible uniquement en local (Cloudflare Tunnel)
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
