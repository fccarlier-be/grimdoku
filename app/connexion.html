<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registre de Brumeval</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="pages.css">
<meta name="robots" content="noindex">
<!-- Retour de la connexion Google (OpenID Connect, réponse id_token) lancée par le jeu (cloud.startLogin), dans le même
     onglet : vérifie state et nonce, ouvre la session (api/login, cookie limité à /api/) puis ramène au jeu, à l'écran
     de départ ; en cas d'échec, le dit avec un lien vers le jeu. -->
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="torn" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main><h1>Registre de Brumeval</h1><p id="msg">Inscription en cours…</p><p id="back" class="retour" hidden><a href="./">Revenir au jeu</a></p></main>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const end = (text) => { msg.textContent = text; document.getElementById('back').hidden = false; };
  const home = (want) => './' + (want && /^#\/[\w\/-]*$/.test(want.back || '') ? want.back : '');
  const f = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname); // le jeton ne reste pas dans l'adresse ni dans l'historique
  let want = null;
  try { want = JSON.parse(localStorage.getItem('grimdoku:oauth')); localStorage.removeItem('grimdoku:oauth'); } catch (e) { /* stockage bloqué */ }
  document.querySelector('#back a').href = home(want);
  if (f.get('error')) return end('Inscription annulée.');
  const token = f.get('id_token');
  if (!token || !want || f.get('state') !== want.state || Date.now() - want.t > 10 * 60 * 1000) return end('Inscription refusée : demande périmée. Recommence depuis le jeu.');
  let claims = null;
  try { const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); claims = JSON.parse(atob(b + '==='.slice((b.length + 3) % 4))); } catch (e) { /* illisible */ }
  if (!claims || claims.nonce !== want.nonce) return end('Inscription refusée : réponse inattendue. Recommence depuis le jeu.');
  const r = await fetch('api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: token }) }).catch(() => null);
  if (!r || !r.ok) return end('Le registre est fermé pour l\'instant. Réessaie un peu plus tard.');
  try { localStorage.setItem('grimdoku:compte', 'true'); localStorage.setItem('grimdoku:inscrit', '1'); } catch (e) { /* stockage bloqué */ }
  msg.textContent = 'Te voilà inscrit au registre de Brumeval. Retour au jeu…';
  location.replace(home(want)); // replace : « précédent » ne repasse pas par cette page
})();
</script>
</body>
</html>
