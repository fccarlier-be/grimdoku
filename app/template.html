  // Ambiance sonore : une boucle pour l'accueil et les menus (menu), une pour les cartes (carte), en fondu.
  // Les navigateurs bloquent le son avant le premier geste : il démarre au premier toucher. Volume par Web Audio
  // (sur iPhone, le volume d'un élément audio ne se règle pas). 🔊 / 🔇 sur chaque écran ; réglage gardé.
  // Les morceaux n'ont pas besoin de boucler d'eux-mêmes : chaque piste a deux lecteurs, et 4 s avant la fin
  // l'autre repart du début en fondu enchaîné (XFADE) — boucle sans coupure, quel que soit le morceau.
  const sound = (() => {
    const XFADE = 4, TAIL = 1.5, MAX = 0.55; // TAIL : fin du morceau ignorée (les générateurs y mettent souvent un fondu)
    // volume choisi par le joueur (0 à 1, barre du panneau 🔊), 0,6 par défaut ; « Couper » le met en sourdine sans l'oublier
    const vol = () => (typeof settings.volume === 'number' ? settings.volume : 0.6);
    const tracks = {};
    for (const [k, src] of Object.entries(MEDIA.audio || {})) {
      try { tracks[k] = { els: [new Audio(src), new Audio(src)], cur: 0, gains: [], gain: null, timer: null }; }
      catch (e) { /* pas de son */ }
    }
    let want = null, ac = null;
    const on = () => settings.sound !== false && vol() > 0;
    // fondu enchaîné vers l'autre lecteur de la piste quand la fin approche
    function watch(t) {
      clearInterval(t.timer);
      t.timer = setInterval(() => {
        const a = t.els[t.cur];
        if (!a.duration || a.currentTime < a.duration - XFADE - TAIL) return;
        const nxt = 1 - t.cur, b = t.els[nxt], now = ac.currentTime;
        b.currentTime = 0; b.play().catch(() => {});
        t.gains[nxt].gain.cancelScheduledValues(now); t.gains[nxt].gain.setValueAtTime(0, now); t.gains[nxt].gain.linearRampToValueAtTime(1, now + XFADE);
        t.gains[t.cur].gain.cancelScheduledValues(now); t.gains[t.cur].gain.setValueAtTime(1, now); t.gains[t.cur].gain.linearRampToValueAtTime(0, now + XFADE);
        setTimeout(() => a.pause(), XFADE * 1000 + 200);
        t.cur = nxt;
      }, 250);
    }
    function apply() {
      if (!ac) return;
      for (const [k, t] of Object.entries(tracks)) {
        const target = on() && k === want ? MAX * vol() : 0;
        t.gain.gain.cancelScheduledValues(ac.currentTime);
        t.gain.gain.setTargetAtTime(target, ac.currentTime, 0.5);
        if (target > 0) {
          const a = t.els[t.cur];
          if (a.paused) { t.gains[t.cur].gain.setValueAtTime(1, ac.currentTime); a.play().catch(() => {}); }
          watch(t);
        } else {
          setTimeout(() => { if (!(on() && k === want)) { clearInterval(t.timer); t.els.forEach(a => a.pause()); } }, 2500);
        }
      }
    }
    return {
      available: Object.keys(tracks).length > 0,
      icon: () => (on() ? '🔊' : '🔇'),
      set(k) { want = tracks[k] ? k : null; apply(); },
      unlock() {
        if (ac || !this.available) return;
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          for (const t of Object.values(tracks)) {
            t.gain = ac.createGain(); t.gain.gain.value = 0; t.gain.connect(ac.destination);
            t.els.forEach((a, i) => { a.preload = 'auto'; t.gains[i] = ac.createGain(); t.gains[i].gain.value = i === 0 ? 1 : 0; ac.createMediaElementSource(a).connect(t.gains[i]).connect(t.gain); });
          }
        } catch (e) { ac = null; return; }
        apply();
      },
      toggle() {
        if (vol() === 0) settings.volume = 0.6; // « Remettre » après une barre à zéro : volume par défaut
        settings.sound = !on(); store.set('settings', settings); this.unlock(); apply();
      },
      volume: () => vol(),
      setVolume(v) { settings.volume = v; if (v > 0) settings.sound = true; store.set('settings', settings); this.unlock(); apply(); }
    };
  })();
  const soundBtn = () => sound.available ? `<button class="iconbtn soundbtn" aria-label="Couper ou remettre le son">${sound.icon()}</button>` : '';
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => sound.unlock(), { once: true }));
  // 🔊 ouvre un petit panneau : barre de volume et Couper / Remettre (se ferme en touchant ailleurs)
  const refreshIcons = () => document.querySelectorAll('.soundbtn').forEach(x => (x.textContent = sound.icon()));
  function soundPanel(btn) {
    const old = document.querySelector('.soundpop');
    if (old) { old.remove(); return; }
    const pop = document.createElement('div');
    pop.className = 'soundpop';
    pop.innerHTML = `<label>Volume <input type="range" min="0" max="100" step="1" value="${Math.round(sound.volume() * 100)}" aria-label="Volume du son"></label>
      <button class="btn mute">${settings.sound !== false && sound.volume() > 0 ? '🔇 Couper' : '🔊 Remettre'}</button>`;
    const r = btn.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
    document.body.appendChild(pop);
    const range = pop.querySelector('input'), mute = pop.querySelector('.mute');
    const sync = () => { mute.textContent = settings.sound !== false && sound.volume() > 0 ? '🔇 Couper' : '🔊 Remettre'; refreshIcons(); };
    range.oninput = () => { sound.setVolume(range.value / 100); sync(); };
    mute.onclick = () => { sound.toggle(); range.value = Math.round(sound.volume() * 100); sync(); };
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.soundbtn');
    if (b) return soundPanel(b);
    const pop = document.querySelector('.soundpop');
    if (pop && !e.target.closest('.soundpop')) pop.remove();
  });

  // Navigation : une adresse par écran (#/, #/bureau, #/lieu/<lieu>, #/dossiers, #/lettres, #/carnet, #/affaire/<id>), le bouton retour du navigateur
  // (ou du téléphone) revient à l'écran précédent.
  function show(route) {
    const [page, arg] = route.split('/');
    sound.set(page === 'affaire' ? 'carte' : 'menu');
    // anciennes adresses (tailles, carte) : le bureau
    if (['bureau', 'tailles', 'niveaux', 'taille', 'carte'].includes(page)) bureauPage();
    else if (page === 'dossiers') dossiersPage();
    else if (page === 'lettres') lettresPage();
    else if (page === 'carnet') carnetPage();
    else if (page === 'lieu' && placeCases(arg).length && unlockedPlaces().has(arg)) lieuPage(arg);
    else if (page === 'affaire' && FINAL && arg === FINAL.id && !finalUnlocked()) bureauPage(); // pas encore arrivée
    else if (page === 'affaire' && PUZZLES.some(p => p.id === arg)) open(arg);
    else home();
    window.scrollTo(0, 0);
  }
  function go(route) {
    try { history.pushState({ route }, '', '#/' + route); } catch (e) { /* page ouverte en fichier local : pas d'historique */ }
    show(route);
  }
  window.addEventListener('popstate', () => show(location.hash.replace(/^#\/?/, '')));
  window.grimGo = go; // tests

  // ---------- partie ----------
  // signature d'une énigme : une sauvegarde faite sur une autre version est ignorée
  const blank = () => ({ pos: {}, pencil: {}, marks: [], done: [], solved: false, sig: sigOf(P) });
  const sigOf = (p) => p.characters.map(c => c.id + ':' + c.name).join('|') + '#' + p.clues.length;
  function open(id) {
    P = PUZZLES.find(p => p.id === id);
    ctx = E.prepare(P);
    computeBadges(P);
    S = store.get('p:' + id, null);
    if (!S || S.sig !== sigOf(P)) S = blank();
    S.pencil = S.pencil || {};
    undo = []; selected = null;
    render();
    window.scrollTo(0, 0);
    // première ouverture : l'enquêteur raconte l'affaire (bible du jeu : sa voix ouvre chaque enquête)
    if (!store.get('seen:' + id, false)) { store.set('seen:' + id, true); introSheet(); }
  }
  const introSheet = () => story(`${MEDIA.decors.includes(P.decor) ? `<div class="story-img" style="background-image:url(media/decor-${P.decor}.webp)"></div>` : ''}
      <h2>${esc(P.title)}</h2><p class="story-text">${esc(P.intro)}</p><div class="row"><button class="btn primary" data-close>À l'enquête</button></div>`, 'intro');
  const save = () => store.set('p:' + P.id, S);
  const WHEEL_MS = 450; // appui long : la roue des personnages s'ouvre au bout de WHEEL_MS
  // une couleur par personnage (lettres au crayon, pastilles) ; la victime en rouge
  const PALETTE = ['#b5562e', '#3f8a3a', '#2f7f86', '#6a4c9c', '#b8862a', '#3d6db5', '#8a6a4a', '#9c4a7a'];
  const colorOf = (ch) => ch.role === 'victim' ? 'var(--blood)' : PALETTE[P.characters.indexOf(ch) % PALETTE.length];
  // ce que nomment les indices du personnage : chaque objet du type cité (praticable ou non), ou la pièce citée.
  // Pas de cases déduites (ligne, colonne, voisines) : ce serait trop facile.
  function compatible(id) {
    const out = new Set();
    for (const cl of P.clues) {
      if (cl.who !== id) continue;
      const L = cl.logic;
      if (L.object) P.objects.filter(o => o.type === L.object).forEach(o => out.add(o.at.join(',')));
      if (L.room) for (let r = 0; r < P.size; r++) for (let c = 0; c < P.size; c++) if (P.layout[r][c] === L.room) out.add(r + ',' + c);
    }
    return out;
  }
  // portrait d'un personnage (assets/characters), découpé en rond ; l'emoji ne sert plus qu'en secours
  const face = (ch) => `<span class="face"><svg class="portrait" role="img" aria-label="${esc(ch.name)}"><use href="#chr-${ch.archetype}"/></svg></span>`;
  const ico = (type) => `<svg class="ico"><use href="#obj-${type}"/></svg>`;
  // Pastille d'un personnage = l'initiale de son nom (demande de François, 2026-10-18) ; si plusieurs personnages de
  // l'énigme la partagent, le plus court début de nom qui les distingue (Fa, Fl…). L'ordre des fiches ne change pas :
  // la première (identifiant a) reste la plus facile à placer.
  let BADGES = {};
  function computeBadges(p) {
    const plain = (n) => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z]/g, '');
    const names = Object.fromEntries(p.characters.map(c => [c.id, plain(c.name)]));
    BADGES = {};
    for (const c of p.characters) {
      const me = names[c.id];
      let k = 1;
      while (k < me.length && p.characters.some(o => o.id !== c.id && names[o.id].slice(0, k).toLowerCase() === me.slice(0, k).toLowerCase())) k++;
      BADGES[c.id] = me[0].toUpperCase() + me.slice(1, k).toLowerCase();
    }
  }
  const letterOf = (ch) => BADGES[ch.id] || ch.id.toUpperCase();
  // met en gras, dans le texte d'un indice, les mots qui portent sa logique
  function emph(cl) {
    const L = cl.logic, terms = [];
    const obj = L.object && E.OBJECTS[L.object];
    if (obj) terms.push(obj.name);
    if (L.room) terms.push(P.rooms[L.room].name);
    if (L.other) terms.push(ctx.chars[L.other].name);
    terms.push({ adjacentTo: 'à côté', notAdjacentTo: 'à côté', sameRowAs: 'même ligne', sameColAs: 'même colonne', sameRoomAs: 'même pièce', alone: 'seule?',
      northOf: 'au nord', southOf: 'au sud', eastOf: "à l'est", westOf: "à l'ouest" }[L.type] || '');
    if (L.type.startsWith('not')) terms.push('pas');
    const pats = terms.filter(Boolean).map(t => t === 'seule?' ? 'seule?' : esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!pats.length) return esc(cl.text);
    return esc(cl.text).replace(new RegExp(`(?<!\\p{L})(${pats.join('|')})(?!\\p{L})`, 'giu'), '<b>$1</b>');
  }
  const snapshot = () => { undo.push(JSON.stringify(S)); if (undo.length > 100) undo.shift(); };
  const charAt = (r, c) => Object.keys(S.pos).find(id => E.cellsOf(S.pos[id]).some(([a, b]) => a === r && b === c));
  const isBig = (id) => !!ctx.chars[id].shape;
  const hiddenSizes = () => P.hiddenMax === 3 ? '2 ou 3 cases' : '2 à 4 cases';
  // forme d'un grand personnage : dessin de la forme connue, ou « 2 à 4 cases » si elle est cachée (5 crânes)
  function shapeHtml(ch) {
    if (!ch.shape) return '';
    if (P.hiddenShapes) return ` <b class="bigtag">· grand : ${hiddenSizes()}</b>`;
    const cs = E.SHAPES[ch.shape].cells, h = Math.max(...cs.map(x => x[0])) + 1, w = Math.max(...cs.map(x => x[1])) + 1;
    const grid = Array.from({ length: h * w }, (_, i) => cs.some(([r, c]) => r * w + c === i) ? '<i></i>' : '<i style="visibility:hidden"></i>').join('');
    return ` <b class="bigtag">· grand : ${E.SHAPES[ch.shape].name}<span class="shape" style="grid-template-columns:repeat(${w},7px);--cc:${colorOf(ch)}" aria-hidden="true">${grid}</span></b>`;
  }
  const roomIdx = (k) => Object.keys(P.rooms).indexOf(k);

  // Murs entre les pièces, dessinés à la main façon BD : traits épais et un peu irréguliers (même tracé à chaque
  // affichage, tiré d'une graine propre à l'énigme). Deux passes d'encre de largeurs différentes font varier l'épaisseur.
  function wallsSvg() {
    if (wallsSvg.for === P.id) return wallsSvg.html;
    const n = P.size, L = P.layout;
    let seed = [...P.id].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
    const rnd = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed >>> 8) / 16777216; };
    // pans de mur d'une case : horizontaux (h, entre les lignes r-1 et r) et verticaux (v, entre les colonnes c-1 et c)
    const edges = {};
    for (let r = 1; r < n; r++) for (let c = 0; c < n; c++) if (L[r][c] !== L[r - 1][c]) edges['h' + r + ',' + c] = { h: true, r, c, a: [r - 1, c], b: [r, c] };
    for (let c = 1; c < n; c++) for (let r = 0; r < n; r++) if (L[r][c] !== L[r][c - 1]) edges['v' + r + ',' + c] = { h: false, r, c, a: [r, c - 1], b: [r, c] };
    // portes (simples ouvertures, pur décor, sans effet sur « à côté de ») : une par paire de pièces voisines,
    // de préférence entre deux cases sans meuble bloquant
    const blocked = ([r, c]) => { const o = ctx.objAt[r + ',' + c]; return !!(o && E.OBJECTS[o.type].blocking); };
    const pairs = {};
    for (const [k, e] of Object.entries(edges)) { const pk = [L[e.a[0]][e.a[1]], L[e.b[0]][e.b[1]]].sort().join('|'); (pairs[pk] = pairs[pk] || []).push(k); }
    const doors = new Set();
    for (const pk of Object.keys(pairs).sort()) {
      const free = pairs[pk].filter(k => !blocked(edges[k].a) && !blocked(edges[k].b));
      const from = free.length ? free : pairs[pk];
      doors.add(from[Math.floor(rnd() * from.length)]);
    }
    const wall = (k) => edges[k] && !doors.has(k);
    // murs fusionnés en lignes droites (coupées aux portes) : [x1, y1, x2, y2] en unités de case
    const lines = [];
    for (let r = 1; r < n; r++) for (let c = 0; c < n;) {
      if (!wall('h' + r + ',' + c)) { c++; continue; }
      const c0 = c; while (c < n && wall('h' + r + ',' + c)) c++;
      lines.push([c0, r, c, r]);
    }
    for (let c = 1; c < n; c++) for (let r = 0; r < n;) {
      if (!wall('v' + r + ',' + c)) { r++; continue; }
      const r0 = r; while (r < n && wall('v' + r + ',' + c)) r++;
      lines.push([c, r0, c, r]);
    }
    // une porte : le pan de mur est ouvert en son milieu (seuls ses deux bouts sont tracés)
    for (const k of doors) {
      const { h, r, c } = edges[k];
      lines.push(h ? [c, r, c + 0.2, r] : [c, r, c, r + 0.2], h ? [c + 0.8, r, c + 1, r] : [c, r + 0.8, c, r + 1]);
    }
    // cadre : centré sur le bord de la carte, tremblé des deux côtés (la carte ne coupe pas ce qui dépasse)
    const frame = [[0, 0, n, 0], [n, 0, n, n], [n, n, 0, n], [0, n, 0, 0]];
    // une ligne tremblée : points intermédiaires décalés perpendiculairement, reliés par des courbes
    const wobbly = ([x1, y1, x2, y2], amp) => {
      const len = Math.hypot(x2 - x1, y2 - y1), k = Math.max(2, Math.round(len * 2.5));
      const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
      const pts = [];
      for (let i = 0; i <= k; i++) {
        const t = i / k, j = i === 0 || i === k ? amp * 0.3 : amp;
        const d = (rnd() * 2 - 1) * j;
        pts.push([x1 + (x2 - x1) * t + nx * d, y1 + (y2 - y1) * t + ny * d]);
      }
      let dpath = `M${pts[0][0].toFixed(3)} ${pts[0][1].toFixed(3)}`;
      for (let i = 1; i < pts.length; i++) {
        const [px, py] = pts[i - 1], [qx, qy] = pts[i];
        dpath += ` Q${px.toFixed(3)} ${py.toFixed(3)} ${((px + qx) / 2).toFixed(3)} ${((py + qy) / 2).toFixed(3)}`;
      }
      return dpath + ` L${pts[pts.length - 1][0].toFixed(3)} ${pts[pts.length - 1][1].toFixed(3)}`;
    };
    const main = lines.map(l => wobbly(l, 0.028)).join(' ');
    const second = lines.map(l => wobbly(l, 0.022)).join(' ');
    const frameMain = frame.map(l => wobbly(l, 0.028)).join(' ');
    const frameSecond = frame.map(l => wobbly(l, 0.022)).join(' ');
    wallsSvg.for = P.id;
    wallsSvg.html = `<svg class="walls" viewBox="0 0 ${n} ${n}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${main}" stroke-width="0.09"/><path d="${second}" stroke-width="0.06"/>
      <path d="${frameMain}" stroke-width="0.09"/><path d="${frameSecond}" stroke-width="0.06"/></svg>`;
    return wallsSvg.html;
  }

  function conflicts() {
    const bad = new Set();
    for (const e of E.checkPlacement(P, S.pos)) e.ids.forEach(i => bad.add(i));
    return bad;
  }
  function violated() {
    const out = new Set();
    P.clues.forEach((cl, i) => {
      const t = cl.logic.type;
      // un indice qui cite un autre personnage (même pièce, nord/sud/est/ouest) attend qu'il soit placé aussi
      const need = [cl.who].concat(cl.logic.other ? [cl.logic.other] : []);
      if (t === 'alone') { if (Object.keys(S.pos).length < P.characters.length) return; }
      else if (!need.every(id => S.pos[id])) return;
      if (!E.evalClue(ctx, cl, S.pos)) out.add(i);
    });
    return out;
  }

  function render() {
    $app.classList.add('game');
    const n = P.size;
    const bad = conflicts();
    const viol = settings.live ? violated() : new Set();
    // lignes et colonnes condamnées : celles des personnages confirmés (pas des lettres au crayon)
    const hints = selected ? compatible(selected) : null;
    const usedR = new Set(), usedC = new Set();
    Object.values(S.pos).forEach(v => E.cellsOf(v).forEach(([r, c]) => { usedR.add(r); usedC.add(c); }));
    const labelled = new Set();
    let cells = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const room = P.layout[r][c];
      const o = ctx.objAt[r + ',' + c];
      const def = o && E.OBJECTS[o.type];
      const who = charAt(r, c);
      const ch = who && ctx.chars[who];
      const cls = ['cell', 'r' + r, 'c' + c];
      if (r > 0 && P.layout[r - 1][c] !== room) cls.push('wt');
      if (c > 0 && P.layout[r][c - 1] !== room) cls.push('wl');
      if (o && o.type === 'tapis') cls.push('tapis');
      if (def && def.blocking) cls.push('block');
      if (o && o.type === 'portail') cls.push('portal');
      if (who) cls.push('has-char');
      const pens = who ? [] : P.characters.filter(x => (S.pencil[x.id] || []).includes(r + ',' + c));
      if (hints && hints.has(r + ',' + c)) cls.push('hint');
      let label = '';
      if (!labelled.has(room)) { labelled.add(room); label = `<span class="roomlabel">${esc(P.rooms[room].name)}</span>`; }
      const objHtml = def ? `<span class="obj" aria-hidden="true">${ico(o.type)}</span>` : '';
      // grand personnage : un corps sur chaque case (joint à ses voisines), son portrait sur chacune
      const bodyCells = ch && isBig(who) ? E.cellsOf(S.pos[who]) : null;
      const joins = bodyCells ? [[-1, 0, 'jn'], [1, 0, 'js'], [0, -1, 'jw'], [0, 1, 'je']].filter(([dr, dc]) => bodyCells.some(([a, b]) => a === r + dr && b === c + dc)).map(x => x[2]).join(' ') : '';
      const body = bodyCells ? `<span class="body ${joins} ${selected === who ? 'sel' : ''} ${bad.has(who) ? 'bad' : ''}" style="--cc:${colorOf(ch)}"></span>` : '';
      const tok = ch ? `${body}<span class="token ${ch.role === 'victim' ? 'victim' : ''} ${selected === who ? 'sel' : ''} ${bad.has(who) ? 'bad' : ''}">${face(ch)}<span class="letter" style="--cc:${colorOf(ch)}">${letterOf(ch)}</span></span>` : '';
      const pencils = pens.length ? `<span class="pencils ${pens.length > 1 ? 'many' : ''}">${pens.map(x => `<span class="pencil ${selected === x.id ? 'sel' : ''}" style="--cc:${colorOf(x)}">${letterOf(x)}</span>`).join('')}</span>` : '';
      // croix automatiques (lignes/colonnes des personnages confirmés) à l'encre : certaines ;
      // croix manuelles au crayon : simples hypothèses du joueur
      const auto = settings.shade && (usedR.has(r) || usedC.has(c));
      const mark = who ? '' : auto ? '<span class="mark">✕</span>' : S.marks.includes(r + ',' + c) ? '<span class="mark manual">✕</span>' : '';
      const aria = `${P.rooms[room].name}, ligne ${r + 1}, colonne ${c + 1}${def ? ', ' + def.name : ''}${ch ? ', ' + ch.name : ''}`;
      if (P.rooms[room].floor) cls.push('fl-' + P.rooms[room].floor);
      cells += `<button class="${cls.join(' ')}" style="--room: var(--r${roomIdx(room) % 8}); --bp: ${c % 2 * 100}% ${r % 2 * 100}%" data-r="${r}" data-c="${c}" aria-label="${esc(aria)}">${label}${objHtml}${tok}${pencils}${mark}</button>`;
    }

    const specials = [];
    if (P.characters.some(c => (c.traits || []).includes('spectre')))
      specials.push(`<span><b>👻 Spectre</b> : peut se tenir sur les meubles bloquants (tables, statues…). Il respecte quand même lignes et colonnes.</span>`);
    if (P.characters.some(c => c.shape))
      specials.push(`<span><b>🐉 Grand personnage</b> : il occupe plusieurs cases, et chacune prend sa ligne et sa colonne. Toutes ses cases sont dans la même pièce, jamais sur un meuble. Sa forme peut être tournée ou retournée.${P.hiddenShapes ? ` <b>Sa forme est inconnue</b> : ${hiddenSizes()}.` : ''} Pour le placer : choisis-le, touche chacune de ses cases pour y écrire sa lettre, puis appui long sur l'une d'elles.</span>`);
    const links = {};
    P.objects.filter(o => o.type === 'portail').forEach(o => (links[o.link] = links[o.link] || []).push(P.rooms[P.layout[o.at[0]][o.at[1]]].name));
    Object.values(links).forEach(l => specials.push(`<span><b>🌀 Portail</b> : ${esc(l[0])} et ${esc(l[1])} comptent comme une seule pièce.</span>`));

    // la victime est toujours présentée en dernier : c'est en la plaçant qu'on démasque le coupable
    const lastIfVictim = (a, b) => (a.role === 'victim') - (b.role === 'victim');
    const cast = [...P.characters].sort(lastIfVictim);
    // une carte par personnage, dans l'ordre A, B, C… (ses indices bout à bout)
    const cards = cast.map(ch => ({ ch, items: P.clues.map((cl, i) => ({ cl, i })).filter(x => x.cl.who === ch.id) })).filter(x => x.items.length || x.ch.role === 'victim');
    const allPlaced = Object.keys(S.pos).length === P.characters.length;
    const myRate = store.get('rate:' + P.id, null);
    $app.innerHTML = `
      <header class="top">
        <button class="iconbtn" id="back" aria-label="Retour aux affaires">‹</button>
        <button class="hdtitle" id="introBtn" aria-label="Lire l'affaire">${esc(P.title)}</button>
        <span class="spacer"></span>
        ${soundBtn()}
        <button class="iconbtn" id="opts" aria-label="Options">⚙︎</button>
        <button class="iconbtn" id="rulesBtn" aria-label="Règles">?</button>
      </header>
      <div class="play">
      <div class="casehead">
        <h2>${esc(P.title)}</h2>
        <details><summary>L'affaire</summary><p>${esc(P.intro)}</p></details>
      </div>
      <div class="boardwrap">
        <div class="board" id="board" style="--n:${n}">${cells}${wallsSvg()}</div>
        ${S.solved ? `<div class="stamp" aria-hidden="true"><span>Affaire<br>résolue</span></div>` : ''}
      </div>
      <div class="rate" role="group" aria-label="Difficulté ressentie">
        <span>Difficulté ressentie</span>
        <span class="rates">${[0, 1, 2, 3, 4, 5].map(k => `<button class="ratebtn" data-rate="${k}" aria-pressed="${myRate === k}">${k}</button>`).join('')}</span>
        <small>0 : très facile · 5 : infernale — ta note nous aide à classer les enquêtes</small>
      </div>
      ${specials.length ? `<div class="special">${specials.join('')}</div>` : ''}
      ${S.solved ? verdictHtml() : `<div class="dock">
        <div class="tools">
          <button class="tbtn" id="hintBtn" aria-label="Indice">🕯️<span class="lbl"> Indice</span></button>
          <button class="tbtn pen" id="penBtn" aria-pressed="${!!settings.cross}" title="Crayon : un toucher barre une case d'une croix (ou l'efface). Les lettres s'écrivent en choisissant un personnage.">✏️<span class="lbl"> Crayon</span></button>
          <span class="spacer"></span>
          <button class="tbtn" id="undo" aria-label="Annuler" ${undo.length ? '' : 'disabled'}>↶<span class="lbl"> Annuler</span></button>
          <button class="accuse" id="accuse" ${allPlaced ? '' : 'disabled'}>Accuser</button>
        </div>
        <div class="tray" id="tray">${cast.map(ch => `
          <button class="chip ${ch.role === 'victim' ? 'victim' : ''} ${S.pos[ch.id] ? 'placed' : ''}" data-id="${ch.id}" aria-pressed="${selected === ch.id}">
            <span class="em" aria-hidden="true">${face(ch)}<span class="letter" style="--cc:${colorOf(ch)}">${letterOf(ch)}</span></span>${esc(ch.name)}
          </button>`).join('')}</div>
      </div>`}
      </div>
      <div class="clues ${selected ? 'has-sel' : ''}">
        <h3>Indices</h3>
        ${cards.map(({ ch, items }) => {
          const idx = items.map(x => x.i);
          const done = idx.length > 0 && idx.every(i => S.done.includes(i));
          const text = items.map(x => emph(x.cl)).join(' ');
          return `<div class="clue ${ch.role === 'victim' ? 'victim' : ''} ${done ? 'done' : ''} ${S.pos[ch.id] ? 'placed' : ''} ${idx.some(i => viol.has(i)) ? 'violated' : ''} ${selected === ch.id ? 'sel' : ''}">
            <button class="em" data-pick="${ch.id}" aria-label="Sélectionner ${esc(ch.name)}">${face(ch)}<span class="letter" style="--cc:${colorOf(ch)}">${letterOf(ch)}</span></button>
            <div style="min-width:0"><div class="who">${esc(ch.name)} <small>${esc(ch.desc || '')}</small>${shapeHtml(ch)}</div>${ch.role === 'victim'
              ? `<p><b class="lead-victim">La victime.</b> ${text ? text + ' ' : ''}Elle était <b>seule avec son meurtrier</b>.</p>`
              : `<p>${text}</p>`}</div>
            ${idx.length ? `<button class="tick" data-done="${idx.join(',')}" aria-label="Marquer comme utilisé" aria-pressed="${done}">✓</button>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    bind();
    if (S.solved && !render.shownWin) { /* rien : la victoire s'affiche à l'accusation */ }
  }

  function bind() {
    document.getElementById('back').onclick = () => go(P.final ? 'bureau' : caseBack === 'dossiers' ? 'dossiers' : 'lieu/' + P.place);
    document.getElementById('rulesBtn').onclick = rules;
    document.getElementById('opts').onclick = options;
    document.getElementById('introBtn').onclick = introSheet;
    document.querySelectorAll('.clue').forEach(card => card.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      const b = card.querySelector('[data-pick]'); if (b) pick(b.dataset.pick);
    }));
    document.querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
      const idx = b.dataset.done.split(',').map(Number); snapshot();
      S.done = idx.every(i => S.done.includes(i)) ? S.done.filter(x => !idx.includes(x)) : [...new Set(S.done.concat(idx))]; save(); render();
    });
    document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => rate(+b.dataset.rate));
    if (S.solved) return bindVerdict();
    document.getElementById('hintBtn').onclick = hint;
    document.getElementById('penBtn').onclick = () => {
      // deux modes séparés : crayon = croix ; un personnage choisi = ses lettres
      settings.cross = !settings.cross; store.set('settings', settings);
      if (settings.cross) selected = null;
      render();
    };
    document.getElementById('undo').onclick = () => { if (!undo.length) return; S = JSON.parse(undo.pop()); save(); render(); };
    document.getElementById('accuse').onclick = accuse;
    document.querySelectorAll('.chip').forEach(b => b.onclick = () => pick(b.dataset.id));
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { pick(b.dataset.pick); document.getElementById('board').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    const tray = document.getElementById('tray');
    tray.scrollLeft = render.trayScroll || 0;
    tray.onscroll = () => { render.trayScroll = tray.scrollLeft; };
    document.querySelectorAll('.cell').forEach(el => {
      let t = null, long = false, downAt = 0;
      const r = +el.dataset.r, c = +el.dataset.c;
      const stop = () => clearTimeout(t);
      // appui long sur une case libre : la roue des personnages s'ouvre autour d'elle (demande de François, 2026-10-18)
      el.addEventListener('pointerdown', () => {
        long = false; downAt = Date.now();
        if (charAt(r, c)) return; // un pion confirmé : le toucher le remet au crayon
        t = setTimeout(() => { long = true; wheel(r, c, el); }, WHEEL_MS);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
      el.addEventListener('contextmenu', e => e.preventDefault());
      // un appui long abandonné en route n'est pas un toucher court
      el.onclick = () => {
        const abandoned = downAt && Date.now() - downAt > 350; // 0 = clic sans appui (clavier, VoiceOver)
        downAt = 0;
        if (long || abandoned) { long = false; return; }
        tap(r, c);
      };
    });
  }

  // choisir un personnage éteint le crayon : on passe aux lettres
  function pickOnly(id) {
    selected = id;
    if (settings.cross) { settings.cross = false; store.set('settings', settings); }
  }
  // Note de difficulté ressentie (0 à 5) : gardée ici, et envoyée au serveur (GET /note, réponse vide ; nginx l'inscrit
  // dans un journal, résumé par tools/notes.sh). v : identifiant anonyme tiré au hasard, pour compter un vote par joueur.
  function rate(k) {
    store.set('rate:' + P.id, k);
    if (!settings.vid) { settings.vid = Math.random().toString(36).slice(2, 10); store.set('settings', settings); }
    const q = `note?g=${encodeURIComponent(P.id)}&d=${k}&v=${settings.vid}&s=${S.solved ? 1 : 0}&n=${P.size}`;
    try { if (window.fetch) fetch(q, { cache: 'no-store', keepalive: true }).catch(() => {}); } catch (e) { /* hors ligne : tant pis */ }
    render();
    toast('Merci ! Ta note aide à classer les enquêtes.');
  }

  function pick(id) {
    if (selected === id) selected = null; else pickOnly(id);
    render();
  }

  function toggleMark(r, c) {
    if (charAt(r, c)) return;
    snapshot();
    const k = r + ',' + c;
    S.marks = S.marks.includes(k) ? S.marks.filter(x => x !== k) : S.marks.concat(k);
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
    save(); render();
  }

  const pencilsAt = (r, c) => P.characters.filter(x => (S.pencil[x.id] || []).includes(r + ',' + c)).map(x => x.id);

  // toucher court, selon l'outil : Crayon allumé = croix (hypothèse du joueur) ; sinon, avec un personnage choisi,
  // sa lettre (plusieurs cases possibles). Un pion confirmé : touché, il est choisi ; touché à nouveau, il redevient
  // une lettre. L'appui long place le personnage choisi.
  function tap(r, c) {
    const who = charAt(r, c);
    const k = r + ',' + c;
    if (settings.cross && !who) return toggleMark(r, c);
    if (who) {
      if (who !== selected) { pickOnly(who); return render(); }
      snapshot(); S.pencil[who] = E.cellsOf(S.pos[who]).map(rc => rc.join(',')); delete S.pos[who]; save(); return render();
    }
    if (!selected) {
      // sans personnage choisi : une case à lettres choisit leur personnage
      const pens = pencilsAt(r, c);
      if (pens.length) { pickOnly(pens[0]); return render(); }
      return toast('Choisis un personnage pour écrire sa lettre, ou allume ✏️ Crayon pour barrer une case.', true);
    }
    if (!E.canStand(ctx, selected, r, c)) {
      const o = ctx.objAt[k];
      return toast(`${ctx.chars[selected].name} ne peut pas se tenir sur ${E.OBJECTS[o.type].the}${isBig(selected) ? ' (un grand personnage ne monte sur aucun meuble)' : ''}.`, true);
    }
    snapshot();
    const list = S.pencil[selected] || [];
    S.pencil[selected] = list.includes(k) ? list.filter(x => x !== k) : list.concat(k);
    S.marks = S.marks.filter(x => x !== k);
    save(); render();
  }

  // Roue des personnages : ceux qui peuvent se tenir sur la case (le personnage choisi en premier, puis l'ordre des fiches,
  // la victime à la fin) ; en toucher un le place là (un grand personnage : avec ses lettres au crayon voisines).
  function wheel(r, c, el) {
    const cast = [...P.characters].sort((a, b) => (a.role === 'victim') - (b.role === 'victim'));
    const list = cast.filter(ch => E.canStand(ctx, ch.id, r, c)).sort((a, b) => (b.id === selected) - (a.id === selected));
    if (!list.length) return toast('Personne ne peut se tenir ici.', true);
    const box = el.getBoundingClientRect();
    const R = Math.max(64, 26 + list.length * 7), size = 2 * R + 56;
    const cx = Math.min(Math.max(box.left + box.width / 2, size / 2 + 4), innerWidth - size / 2 - 4);
    const cy = Math.min(Math.max(box.top + box.height / 2, size / 2 + 4), innerHeight - size / 2 - 4);
    $layer.innerHTML = `<div class="wheel-layer" id="wheelLayer"><div class="wheel" style="left:${cx}px;top:${cy}px;width:${size}px;height:${size}px">
      <span class="wheel-cell">L${r + 1} C${c + 1}</span>
      ${list.map((ch, i) => {
        const a = -Math.PI / 2 + i * 2 * Math.PI / list.length;
        return `<button class="wheel-item ${ch.id === selected ? 'sel' : ''} ${S.pos[ch.id] ? 'placed' : ''} ${ch.role === 'victim' ? 'victim' : ''}" data-wid="${ch.id}" title="${esc(ch.name)}" aria-label="Placer ${esc(ch.name)} ici" style="left:${size / 2 + R * Math.cos(a)}px;top:${size / 2 + R * Math.sin(a)}px">${face(ch)}<span class="letter" style="--cc:${colorOf(ch)}">${letterOf(ch)}</span></button>`;
      }).join('')}</div></div>`;
    const layer = document.getElementById('wheelLayer');
    layer.onclick = (e) => {
      const it = e.target.closest('[data-wid]');
      close();
      if (it) confirmAt(it.dataset.wid, r, c);
    };
  }
  // cases d'un grand personnage : ses lettres au crayon reliées (par les côtés) à la case appuyée
  function bigCells(id, r, c) {
    const pen = new Set((S.pencil[id] || []).concat(r + ',' + c));
    const out = [], todo = [[r, c]], seen = new Set([r + ',' + c]);
    while (todo.length) {
      const [a, b] = todo.pop(); out.push([a, b]);
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = (a + dr) + ',' + (b + dc);
        if (pen.has(k) && !seen.has(k)) { seen.add(k); todo.push([a + dr, b + dc]); }
      }
    }
    return out.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  }
  function confirmAt(id, r, c) {
    let v = [r, c];
    if (isBig(id)) {
      v = bigCells(id, r, c);
      if (!E.isPlacement(ctx, id, v)) {
        const ch = ctx.chars[id];
        const what = P.hiddenShapes ? hiddenSizes() : E.SHAPES[ch.shape].name + ' (tournées ou retournées)';
        return toast(`${ch.name} occupe ${what}, dans une seule pièce et hors des meubles. Marque au crayon exactement ses cases, puis appuie longuement sur l'une d'elles.`, true, 6000);
      }
    }
    snapshot();
    S.pos[id] = v;
    delete S.pencil[id];
    const ks = E.cellsOf(v).map(rc => rc.join(','));
    S.marks = S.marks.filter(x => !ks.includes(x));
    selected = null;
    if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
    save(); render();
  }

  // 💡 Indice : signale d'abord une erreur parmi les personnages confirmés, sinon désigne le prochain
  // personnage qu'on peut déduire et le raisonnement à utiliser (jamais la case).
  // ce que l'enquêteur marmonne en relisant ses notes (bible du jeu : compétent, épuisé, poli)
  const HINT_TEXT = [
    (n) => `Relisons la fiche de ${n}. Ses indices ne laissent qu'une case. Bon.`,
    (n) => `${n}… On retire les lignes et les colonnes déjà prises : il ne reste qu'une case. Évidemment.`,
    (n) => `Quelqu'un n'a plus qu'une ligne possible, ou qu'une colonne : elle est à lui, les autres n'ont rien à y faire. Ça suffit pour placer ${n}.`,
    (n) => `Nord, sud, est, ouest. Les positions relatives coincent ${n}. Ce n'est pas sorcier. Enfin, pas ici.`,
    (n) => `Une ligne, ou une colonne, où un seul personnage peut encore aller. C'est ${n}. Il fallait la voir.`,
    (n) => `La règle des pièces : un suspect par pièce, la victime avec un seul, et pas une pièce vide. Ça place ${n}.`,
    (n) => `Quelques-uns se partagent exactement autant de lignes qu'ils sont. Personne d'autre n'y entre. Ça place ${n}.`
  ];
  function hint() {
    const sol = P.solution.positions;
    const wrong = Object.keys(S.pos).find(id => E.posKey(S.pos[id]) !== E.posKey(sol[id]));
    if (wrong) { pickOnly(wrong); render(); return toast(`Quelque chose cloche : ${ctx.chars[wrong].name} n'est pas à sa place.`, true, 5000); }
    hint.steps = hint.steps && hint.for === P.id ? hint.steps : E.humanSolve(P, P.clues, 2).steps;
    hint.for = P.id;
    for (const st of hint.steps) {
      const id = st.ids.find(x => !S.pos[x]);
      if (!id) continue;
      pickOnly(id); render();
      return toast('💡 ' + HINT_TEXT[st.tech](ctx.chars[id].name), false, 6000);
    }
    toast('Tout le monde est à sa place : il ne reste plus qu\'à accuser !', false, 4000);
  }

  function accuse() {
    const errs = E.checkPlacement(P, S.pos);
    if (errs.some(e => e.kind === 'row')) return toast('Deux personnes partagent une ligne. Une seule par ligne !', true);
    if (errs.some(e => e.kind === 'col')) return toast('Deux personnes partagent une colonne. Une seule par colonne !', true);
    if (errs.some(e => e.kind === 'shape')) return toast('Un grand personnage n\'a pas la bonne forme.', true);
    if (errs.some(e => e.kind === 'room')) return toast('Deux suspects partagent une pièce : seule la pièce du crime abrite deux personnes.', true);
    if (errs.some(e => e.kind === 'empty')) return toast('Une pièce est vide : chaque pièce est occupée.', true);
    const m = E.murdererOf(ctx, S.pos);
    if (!m) return toast('La victime doit être seule avec exactement un suspect dans sa pièce.', true);
    const ok = Object.keys(P.solution.positions).every(id => S.pos[id] && E.posKey(S.pos[id]) === E.posKey(P.solution.positions[id]));
    if (!ok) {
      const v = violated();
      if (v.size) { settings.live = true; store.set('settings', settings); render(); return toast(`${v.size} indice${v.size > 1 ? 's' : ''} ne colle${v.size > 1 ? 'nt' : ''} pas. Ils sont surlignés en rouge.`, true); }
      return toast("Tout semble coller… mais ce n'est pas la bonne scène. Un indice t'a peut-être échappé.", true);
    }
    const before = unlockedPlaces(); // lieux ouverts avant cette victoire
    S.solved = true; selected = null; save();
    render.newLetter = grantLetter(P);
    render.newPlaces = [...unlockedPlaces()].filter(pl => !before.has(pl)); // ceux que la lettre vient d'ouvrir
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    verdictStory(render.newLetter);
  }

  // verdict affiché sous la carte une fois l'affaire résolue (remplace le dock)
  // Lettres d'Augure (fil rouge) : la première enquête résolue dans un lieu donne la lettre de ce lieu
  const letters = () => store.get('lettres', []);
  const finalUnlocked = () => letters().length >= LORE.need;
  // lettres pas encore lues dans le carnet (le bouton du carnet le signale)
  const unread = () => letters().filter(pl => !store.get('lettres-lues', []).includes(pl)).length;
  function grantLetter(p) {
    const got = letters();
    if (!LORE.letters[p.place] || got.includes(p.place)) return null;
    store.set('lettres', got.concat(p.place));
    return p.place;
  }
  const placeTitle = (place) => { const p = PUZZLES.find(q => q.place === place && !q.final); return p ? p.title.split(' — ')[0] : place; };
  // épilogue : un dialogue (« — » en début de ligne), l'enquêteur puis le coupable
  const dialogue = (text) => text.split('\n').map((l, i) => `<p class="epl ${i % 2 ? 'them' : 'me'}">${esc(l)}</p>`).join('');
  // Prologue du lore (lore/prologue.json) : quatre scènes au centre de l'écran à la première partie ; « Passer » le
  // referme, le carnet permet de le revoir. Il se termine sur la carte de Brumeval.
  function prologue(i = 0) {
    const sc = LORE.prologue[i], last = i === LORE.prologue.length - 1;
    const para = (t) => t.split('\n').map(x => `<p class="story-text">${esc(x)}</p>`).join('');
    const body = sc.guide
      ? `<h2>${esc(sc.titre)}</h2><ol class="guide">${sc.guide.map(g => `<li>${esc(g)}</li>`).join('')}</ol><p class="story-count">${esc(sc.conseil)}</p>`
      : sc.sceau
        ? `<div class="seal-a" aria-hidden="true">${esc(sc.sceau)}</div><small class="story-from">${esc(sc.de)}</small>${sc.texte.split('\n').map(x => `<p class="story-letter reveal">${esc(x)}</p>`).join('')}<p class="story-sign">${esc(sc.signature)}</p>${sc.apres ? `<p class="story-text aside">${esc(sc.apres)}</p>` : ''}`
        : `${sc.image === 'carte' && MEDIA.map ? `<div class="story-img map" style="background-image:url(${MEDIA.map})"></div>` : ''}<h2>${esc(sc.titre)}</h2>${para(sc.texte)}`;
    const ov = story(`${body}<div class="row">${last ? '' : '<button class="btn" data-close>Passer</button>'}
      <button class="btn primary" id="prologueNext">${last ? 'À mon bureau' : 'Suite'}</button></div>
      <small class="story-count">${i + 1} / ${LORE.prologue.length}</small>`, 'prologue-story');
    store.set('prologue', true);
    ov.querySelector('#prologueNext').onclick = () => { if (last) { close(); go('bureau'); } else prologue(i + 1); };
  }
  // Scènes de fin : le coupable et son dialogue avec l'enquêteur, puis la lettre d'Augure si l'enquête en apporte une
  function verdictStory(newLetter) {
    const k = ctx.chars[P.solution.murderer];
    const v = P.characters.find(c => c.role === 'victim');
    const ov = story(`<div class="wanted">Affaire résolue</div>
      <span class="em big story-face">${face(k)}</span>
      <b class="culprit">${esc(k.name)}</b>
      <p class="why">Seul suspect dans la pièce de ${esc(v.name)}.</p>
      <div class="epi">${dialogue(P.epilogue)}</div>
      <div class="row">${P.revelation ? `<button class="btn primary" id="toReveal">📜 Dans les archives du Palier zéro…</button>`
        : newLetter ? `<button class="btn primary" id="toLetter">📜 Une lettre a été glissée sous la porte…</button>` : `<button class="btn primary" data-close>Fermer</button>`}</div>`, 'verdict-story');
    const b = ov.querySelector('#toLetter'); if (b) b.onclick = () => letterStory(newLetter);
    const r = ov.querySelector('#toReveal'); if (r) r.onclick = revelationStory;
  }
  // Affaire finale : la révélation commune (canon de la matrice de continuité), la même quel que soit le coupable de la
  // grille — la lettre de Fizzlebarbe trouvée au Palier zéro, puis le billet d'Augure
  function revelationStory() {
    const R = P.revelation;
    const ov = story(`<div class="seal-a" aria-hidden="true">F</div>
      <small class="story-from">Archives du Palier zéro · la lettre de Fizzlebarbe</small>
      ${R.lettre.split('\n').map(par => `<p class="story-letter reveal">${esc(par)}</p>`).join('')}
      <p class="story-sign">${esc(R.signature)}</p>
      <div class="row"><button class="btn primary" id="toBillet">Un billet tombe de l'enveloppe…</button></div>`, 'letter-story revelation-story');
    ov.querySelector('#toBillet').onclick = () => story(`<div class="seal-a" aria-hidden="true">A</div>
      <small class="story-from">Billet d'Augure</small>
      <p class="story-letter">${esc(R.billet)}</p>
      <p class="story-sign">— A.</p>
      <p class="story-count">${esc(R.apres)}</p>
      <div class="row"><button class="btn primary" data-close>Fermer le dossier</button></div>`, 'letter-story billet-story');
  }
  function letterStory(place) {
    const n = letters().length, total = Object.keys(LORE.letters).length;
    const ov = story(`<div class="seal-a" aria-hidden="true">A</div>
      <small class="story-from">Lettre anonyme · ${esc(placeTitle(place))}</small>
      <p class="story-letter">${esc(LORE.letters[place])}</p>
      <p class="story-sign">— A.</p>
      ${(render.newPlaces || []).length ? `<p class="story-newplaces">🗺️ Sur ta carte, ${render.newPlaces.length > 1 ? 'de nouveaux lieux s\'ouvrent' : 'un nouveau lieu s\'ouvre'} : <b>${render.newPlaces.map(pl => esc(placeTitle(pl))).join(', ')}</b></p>` : ''}
      <p class="story-count">${n} / ${total} lettres anonymes${FINAL && !finalUnlocked() ? ` · encore ${LORE.need - n} avant que tout s'éclaire` : FINAL ? ' · <b>une enveloppe vient d\'arriver sur ton bureau</b>' : ''}</p>
      <div class="row"><button class="btn" id="letterLater">Plus tard</button><button class="btn primary" id="toCarnet">🗺️ Retour au bureau</button></div>`, 'letter-story');
    // deux choix sans ambiguïté (retour de François : « Ranger dans mon carnet » ne faisait que refermer, on croyait que rien ne se passait)
    ov.querySelector('#toCarnet').onclick = () => { close(); go('bureau'); };
    ov.querySelector('#letterLater').onclick = () => { close(); toast('📜 Lettre rangée avec les autres, sur ton bureau.'); };
  }
  function verdictHtml() {
    const k = ctx.chars[P.solution.murderer];
    const v = P.characters.find(c => c.role === 'victim');
    const next = nextCase();
    return `<div class="verdictcard">
        <div class="wanted">Coupable</div>
        <span class="em big">${face(k)}</span>
        <b class="culprit">${esc(k.name)}</b>
        <p class="why">Seul suspect dans la pièce de ${esc(v.name)}.</p>
        <div class="epi">${dialogue(P.epilogue)}</div>
        ${P.revelation ? `<button class="btn" id="rereadReveal">📜 Relire la lettre de Fizzlebarbe</button>` : ''}
        ${render.newLetter === P.place ? `<div class="letter-augure"><b>📜 Une lettre anonyme glissée sous la porte</b><p>${esc(LORE.letters[P.place])}</p><small>— A. · ${letters().length} / ${Object.keys(LORE.letters).length} lettres dans ton carnet</small></div>` : ''}
        <div class="row">
          <button class="btn" id="replayBtn">Rejouer</button>
          ${next ? `<button class="btn primary" id="nextBtn">Affaire suivante</button>` : `<button class="btn primary" id="homeBtn">Retour au bureau</button>`}
        </div>
      </div>`;
  }
  // affaire suivante : dans l'ordre (taille, difficulté), sans l'affaire finale
  const nextCase = () => P.final ? null : placeCases(P.place).find(p => p !== P && !isSolved(p));
  function bindVerdict() {
    const next = nextCase();
    const rr = document.getElementById('rereadReveal'); if (rr) rr.onclick = revelationStory;
    document.getElementById('replayBtn').onclick = () => { S = blank(); undo = []; save(); render(); };
    const nb = document.getElementById('nextBtn'); if (nb) nb.onclick = () => go('affaire/' + next.id);
    const hb = document.getElementById('homeBtn'); if (hb) hb.onclick = () => go('bureau');
  }

  // ---------- fenêtres ----------
  function sheet(html) {
    $layer.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const ov = document.getElementById('ov');
    ov.onclick = (e) => { if (e.target === ov || e.target.hasAttribute('data-close')) close(); };
  }
  function close() { $layer.innerHTML = ''; }
  // Scène du lore, au centre de l'écran (intro, verdict, lettre d'Augure) : plus visible qu'une fenêtre en bas de page
  function story(html, cls = '') {
    $layer.innerHTML = `<div class="overlay center" id="ov"><div class="sheet story ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
    const ov = document.getElementById('ov');
    ov.onclick = (e) => { if (e.target === ov || e.target.hasAttribute('data-close')) close(); };
    return ov;
  }

  function rules() {
    const objs = Object.entries(E.OBJECTS).filter(([k]) => k !== 'portail');
    sheet(`
      <h2>Comment enquêter</h2>
      <ul>
        <li>Place chaque personnage sur la carte, victime comprise.</li>
        <li><b>Une seule personne par ligne et par colonne.</b></li>
        <li>Certains meubles sont <b>bloquants</b> (table, tonneau, statue…) : personne ne peut s'y tenir. Les autres (chaise, lit, tapis…) sont praticables. La liste est plus bas, dans « Mobilier ».</li>
        <li>Quand quelqu'un est sur un meuble (chaise, lit, tapis…), un indice le dit toujours.</li>
        <li>« Au nord de X » veut dire sur une ligne plus haute que X, dans n'importe quelle colonne (sud : plus bas ; est : plus à droite ; ouest : plus à gauche).</li>
        <li>« À côté de » veut dire juste au-dessus, en dessous, à gauche ou à droite, dans la même pièce. Pas en diagonale, ni à travers un mur — même par une porte : les portes ne sont qu'un décor.</li>
        <li><b>Seule la pièce du crime contient deux personnes</b> : chaque suspect était seul dans sa pièce, sauf le coupable, qui était avec la victime.</li>
        <li><b>Chaque pièce est occupée</b> : aucune pièce n'est vide (deux pièces reliées par un portail comptent pour une).</li>
        <li><b>La victime</b> est un invité de passage à Brumeval ; les suspects, eux, sont les habitués, et tu les retrouveras d'une enquête à l'autre. Chacun porte une <b>pastille</b> avec l'initiale de son nom (deux lettres si deux noms commencent pareil). Les fiches sont rangées de la plus facile à placer à la plus difficile.</li>
        <li><b>Ton bureau</b> : la carte de Brumeval y est épinglée. Au début, seul le château t'est ouvert ; chaque affaire résolue ouvre de nouveaux lieux (pastille « ! »). Les dossiers classés, les lettres reçues et ton carnet sont posés à côté.</li>
        <li><b>Lettres anonymes</b> : la première enquête résolue dans chaque lieu te vaut une lettre anonyme, rangée sur ton bureau. Assez de lettres, et il se passera quelque chose.</li>
        <li>La victime n'a pas d'indice : c'est à toi de la trouver.</li>
        <li><b>Grands personnages</b> : ils occupent plusieurs cases (2 cases jusqu'en 8×8, jusqu'à 3 en 9×9, jusqu'à 4 au-delà), en ligne, en angle, en carré, en T ou en zigzag, et leur forme peut être tournée ou retournée. Chacune de leurs cases prend sa ligne et sa colonne. Toutes leurs cases sont dans la même pièce, jamais sur un meuble. « À côté de » et « même ligne / colonne » valent pour n'importe laquelle de leurs cases ; « au nord de X » veut dire toutes leurs cases plus haut que X. Sur les grandes cartes, leur forme est parfois inconnue : leur fiche dit seulement combien de cases ils peuvent occuper.</li>
      </ul>
      <div class="sect">Gestes</div>
      <ul>
        <li>Touche un personnage, puis une case : sa <b>lettre</b> s'y inscrit. Tu peux noter plusieurs cases possibles ; touche une lettre à nouveau pour l'effacer.</li>
        <li>Outil ✏️ <b>Crayon</b> : touche une case pour la barrer d'une croix <b>au crayon gris-bleu</b> (ta propre hypothèse) ; touche-la encore pour l'effacer. Choisir un personnage éteint le crayon.</li>
        <li><b>Appui long</b> sur une case : une roue s'ouvre avec les personnages qui peuvent s'y tenir ; touche celui que tu places là pour de bon (un personnage déjà placé y est déplacé). Un grand personnage : sa lettre au crayon sur chacune de ses cases, puis appui long sur l'une d'elles et choisis-le dans la roue ; son portrait s'affiche alors sur chacune.</li>
        <li>Quand un personnage est choisi, ce que nomment ses indices s'allume en bleu : les objets cités (tous ceux du même type) ou la pièce citée.</li>
        <li>Une fois un personnage placé pour de bon, sa ligne et sa colonne se remplissent de croix <b>à l'encre noire</b> : ces cases sont condamnées.</li>
        <li>Touche deux fois un personnage placé pour le remettre en lettres.</li>
        <li>Bouton 💡 <b>Indice</b> : signale une erreur, ou désigne le prochain personnage à déduire et le raisonnement à utiliser.</li>
        <li>Le ✓ d'un indice le grise quand tu l'as exploité.</li>
      </ul>
      <div class="sect">Mobilier</div>
      <div class="objgrid">${objs.map(([k, o]) => `<span><em>${ico(k)}</em>${esc(o.name)} <span class="tag">${o.blocking ? 'bloquant' : 'praticable'}</span></span>`).join('')}</div>
      <div class="row"><button class="btn primary" data-close>Compris</button></div>`);
  }

  function options() {
    sheet(`
      <h2>Options</h2>
      <label class="toggle">Croix automatiques sur les lignes et colonnes des personnages placés <input type="checkbox" id="optShade" ${settings.shade ? 'checked' : ''}></label>
      <label class="toggle">Signaler en direct les indices contredits <input type="checkbox" id="optLive" ${settings.live ? 'checked' : ''}></label>
      <div class="row">
        <button class="btn" id="resetBtn">Recommencer l'affaire</button>
        <button class="btn primary" data-close>Fermer</button>
      </div>`);
    document.getElementById('optShade').onchange = (e) => { settings.shade = e.target.checked; store.set('settings', settings); render(); };
    document.getElementById('optLive').onchange = (e) => { settings.live = e.target.checked; store.set('settings', settings); render(); };
    document.getElementById('resetBtn').onclick = (e) => {
      if (e.target.dataset.armed) { snapshot(); S = blank(); save(); close(); render(); return; }
      e.target.dataset.armed = '1'; e.target.textContent = 'Sûr ? Tout effacer';
    };
  }

  function toast(msg, isBad, ms = 3200) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.className = 'toast' + (isBad ? ' bad' : ''); t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
  }

  // reprise après mise à jour de la page
  const start = (data) => { if (data && data.open) open(data.open); else show(location.hash.replace(/^#\/?/, '')); };
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ open: P ? P.id : null }));
    window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data || {});
  } else start({});
})();
</script>
