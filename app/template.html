<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimdoku</title>
<meta name="theme-color" content="#16111d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout : appli une colonne. Carte-parchemin (la grille) posée sur une table de taverne la nuit,
   barre des personnages collée en bas sous le pouce, indices en dessous. Thème sombre unique, assumé. */
:root {
  color-scheme: dark;
  --night: #16111d;        /* fond : encre violette */
  --board: #221a2b;        /* surfaces */
  --board-2: #2d2337;
  --line: #3d3148;
  --fg: #efe6d6;           /* texte principal */
  --muted: #a99bb4;
  --candle: #f0a93a;       /* accent : flamme de bougie */
  --candle-ink: #2a1a05;
  --parch: #ead9b5;        /* parchemin */
  --ink: #2b2016;          /* encre sur parchemin */
  --ink-soft: rgba(43, 32, 22, .16);
  --blood: #e2574c;
  --ok: #86c98f;
  --r0: #e8d39f; --r1: #c9d9a4; --r2: #b4d0d2; --r3: #dcbcd2;
  --r4: #ecbf9c; --r5: #c3c0e6; --r6: #d9d1b4; --r7: #bcd6b9;
  --f-display: "Pirata One", "Luminari", "Papyrus", Georgia, serif;
  --f-body: "Alegreya Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
html, body { background: var(--night); color: var(--fg); }
body {
  font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(120% 60% at 50% -10%, #2f2340 0%, transparent 60%),
    var(--night);
  min-height: 100%;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 12px 24px; }

/* ---------- en-tête ---------- */
header.top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--f-display); font-size: 30px; line-height: 1; letter-spacing: .5px; color: var(--candle); margin: 0; }
.brand small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.top .spacer { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--board); display: grid; place-items: center; font-size: 18px; }

/* ---------- accueil ---------- */
.lead { color: var(--muted); margin: 0; max-width: 60ch; }
.cases { display: flex; flex-direction: column; gap: 10px; }
.level { border-top: 1px solid var(--line); padding-top: 10px; }
.level summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0 10px; }
.level summary::-webkit-details-marker { display: none; }
.level summary b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--candle); }
.level summary .count { margin-left: auto; font-size: 13px; color: var(--muted); }
.level summary .skulls { font-size: 13px; }
@media (min-width: 900px) and (hover: hover) {
  #app:not(.game) { max-width: 1000px; }
  #app:not(.game) .cases { display: grid; grid-template-columns: 1fr 1fr; }
}
.case { --red-ink: #a3312a; --sepia: #8a4b12;
  display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--board); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
}
.case .seal { width: 56px; height: 56px; border-radius: 8px; background: var(--parch); display: grid; place-items: center; font-size: 30px; }
.case h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; line-height: 1.05; text-wrap: balance; }
.case .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
.case .state { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; border-radius: 99px; background: var(--board-2); color: var(--muted); }
.case .state.done { background: rgba(134, 201, 143, .15); color: var(--ok); }
.skulls { letter-spacing: 1px; }

/* ---------- jeu ---------- */
.casehead h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; line-height: 1; text-wrap: balance; }
.casehead p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.casehead details summary { list-style: none; color: var(--candle); font-size: 14px; cursor: pointer; margin-top: 6px; }
.casehead details summary::-webkit-details-marker { display: none; }

.board {
  --n: 6;
  container-type: inline-size;
  width: 100%; max-width: 100%;
  display: grid; grid-template-columns: repeat(var(--n), 1fr);
  border: 0; overflow: visible; position: relative; /* seul le cadre dessiné à la main (wallsSvg) borde la carte */
  background: var(--parch);
  margin: 14px; width: calc(100% - 28px);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.cell {
  position: relative; aspect-ratio: 1; border: 0; padding: 0; margin: 0;
  color: var(--ink);
  border-top: 1px solid var(--ink-soft); border-left: 1px solid var(--ink-soft);
  display: grid; place-items: center; overflow: visible;
  font-size: calc(100cqw / var(--n) * .5);
}
.walls { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
.walls path { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
/* sols : texture de la matière (2×2 cases), teintée par la couleur de la pièce ; sans texture, couleur unie */
.cell {
  --tint: color-mix(in srgb, var(--room) 42%, transparent);
  background-color: var(--room);
  background-image: linear-gradient(var(--tint), var(--tint)), var(--floor, none);
  background-size: 100% 100%, 200% 200%;
  background-position: 0 0, var(--bp, 0 0);
}
/* cadre : feuille de parchemin aux bords déchirés et brûlés sous la carte */
.boardwrap { isolation: isolate; }
.boardwrap::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 4px;
  background: var(--parch-tex, none) center / 200px, linear-gradient(#e6d1a2, #d9bf88);
  box-shadow: inset 0 0 14px 2px rgba(110, 60, 15, .55), 0 10px 26px rgba(0, 0, 0, .45);
  filter: url(#torn);
}
.cell.r0 { border-top-color: transparent; }
.cell.c0 { border-left-color: transparent; }
.cell .obj { position: relative; width: 78%; aspect-ratio: 1; display: block; }
.ico { display: block; width: 100%; height: 100%; }
.face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: block; }
.portrait { display: block; width: 100%; height: 100%; }
.seal, .verdict .em { position: relative; }
.cell.tapis .obj, .cell.tapis.has-char .obj { position: absolute; inset: 4%; width: auto; z-index: 0; } /* le tapis couvre la case, sous le pion */
.cell.portal .obj { filter: drop-shadow(0 0 4px rgba(60, 170, 255, .9)); animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cell.has-char .obj { position: absolute; right: 3%; bottom: 3%; width: 38%; z-index: 4; animation: none; }
.cell .roomlabel {
  position: absolute; top: calc(100cqw / var(--n) * .13); left: calc(100cqw / var(--n) * .12); z-index: 3; pointer-events: none; /* dégagé des murs dessinés (épaisseur proportionnelle à la case) */
  font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  color: rgba(43, 32, 22, .72); line-height: 1;
}
.cell .mark.manual { color: #4f6b8f; font-weight: 400; font-size: 1em; -webkit-text-stroke: 0; opacity: .9; }
.cell .mark { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; color: var(--ink); font-size: 1.2em; font-weight: 700; line-height: 1; pointer-events: none; }
/* lettres au crayon : dans le coin, couleur du personnage, le meuble reste visible */
.pencils { position: absolute; top: 3%; left: 4%; right: 4%; z-index: 3; display: flex; flex-wrap: wrap; gap: 0 .12em; pointer-events: none; }
.pencil {
  color: var(--cc); font: 800 .78em/1 var(--f-body);
  -webkit-text-stroke: .09em var(--ink); paint-order: stroke fill;
}
.pencils.many .pencil { font-size: .55em; }
.pencil.sel { text-decoration: underline; text-decoration-color: var(--candle); text-decoration-thickness: .12em; }
.charge {
  position: fixed; z-index: 50; width: var(--s); height: var(--s); display: grid; place-items: center; pointer-events: none;
  background: var(--parch); border-radius: 50%; box-shadow: 0 0 0 2px var(--ink), 0 8px 24px rgba(0,0,0,.5);
}
.charge svg { position: absolute; inset: 5%; width: 90%; height: 90%; transform: rotate(-90deg); }
.charge circle { fill: none; stroke-width: 3.5; }
.charge .track { stroke: rgba(43, 32, 22, .25); }
.charge .fill { stroke: var(--cc, var(--candle)); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: charge var(--fill, 1.25s) linear forwards; }
.charge b { color: var(--cc); font: 800 calc(var(--s) * .45)/1 var(--f-body); -webkit-text-stroke: .09em var(--ink); paint-order: stroke fill; }
@keyframes charge { to { stroke-dashoffset: 0; } }
.token {
  position: relative; z-index: 3; width: 78%; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; line-height: 1; font-size: .95em;
  background: #fff8e8; box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 0 0 2px var(--ink);
}
.token.victim { box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 0 0 2px var(--blood); background: #ffe9e4; }
.token.sel { box-shadow: 0 0 0 3px var(--candle), 0 0 12px var(--candle); }
.token.bad { box-shadow: 0 0 0 3px var(--blood); animation: wobble .4s; }
@keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.body { /* grand personnage : un corps continu sur toutes ses cases */
  position: absolute; inset: 9%; z-index: 2; pointer-events: none; border-radius: 22%;
  background: color-mix(in srgb, var(--cc) 30%, #fff8e8); box-shadow: 0 0 0 2px var(--ink);
}
.body.jn { top: -2px; border-top-left-radius: 0; border-top-right-radius: 0; }
.body.js { bottom: -2px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.body.jw { left: -2px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.body.je { right: -2px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.body.sel { box-shadow: 0 0 0 3px var(--candle), 0 0 12px var(--candle); }
.body.bad { box-shadow: 0 0 0 3px var(--blood); }
/* grand personnage : son portrait, un peu plus petit, sur chacune de ses cases */
.body ~ .token { width: 70%; }
.shape { display: inline-grid; gap: 1px; vertical-align: -2px; margin-left: 4px; }
.shape i { width: 7px; height: 7px; background: var(--cc); box-shadow: 0 0 0 1px var(--ink); border-radius: 1px; }
.cell.hint::after { content: ""; position: absolute; inset: 0; background: rgba(90, 150, 255, .38); box-shadow: inset 0 0 0 2px rgba(50, 110, 230, .85); pointer-events: none; }


.special { background: var(--board); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.special b { color: var(--candle); font-weight: 500; }
/* carte de Brumeval : illustration et repères, ou plan par contrées */
.carte { position: relative; width: 100%; background: center / contain no-repeat; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .5)); }
.dot { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); width: 28px; height: 28px; border: 0; border-radius: 50%; padding: 0;
  display: grid; place-items: center; font: 700 13px/1 var(--f-body); color: var(--ink); background: rgba(241, 227, 194, .96);
  box-shadow: inset 0 0 0 2px rgba(43, 32, 22, .7), 0 3px 6px rgba(0, 0, 0, .5); cursor: pointer; }
.dot.done { background: #a3312a; color: #fbe7cf; box-shadow: inset 0 0 0 2px #6e1a14, 0 3px 6px rgba(0, 0, 0, .5); }
.dot:hover, .dot:focus-visible { z-index: 5; transform: translate(-50%, -50%) scale(1.15); outline: none; }
.dot .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); display: none; white-space: nowrap; padding: 5px 9px; border-radius: 6px;
  color: var(--ink); background: rgba(241, 227, 194, .98); box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .6), 0 3px 8px rgba(0, 0, 0, .5); text-align: center; }
.dot .tip b { display: block; font: 400 15px/1.1 var(--f-display); }
.dot .tip small { font: 400 12px/1 var(--f-body); color: #6e5434; }
.dot:hover .tip, .dot:focus-visible .tip { display: block; }
.pin { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 9px; border: 0; border-radius: 6px; color: var(--ink); background: rgba(241, 227, 194, .94); box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .6), 0 3px 6px rgba(0, 0, 0, .45); font-family: var(--f-body); cursor: pointer; }
.pin b { font: 400 15px/1.1 var(--f-display); }
.pin small { font-size: 12px; color: #6e5434; }
.pin.done { box-shadow: inset 0 0 0 2px #a3312a, 0 3px 6px rgba(0, 0, 0, .45); }
.pin i { display: inline-block; margin-right: 6px; font: 700 12px/1 var(--f-body); font-style: normal; color: #8a4b12; }
.carte + .contrees { margin-top: 16px; }
.contree .pin { flex-direction: row; flex-wrap: wrap; align-items: baseline; }
.contree .pin small { width: 100%; padding-left: 18px; text-align: left; }
@media (max-width: 699px) { .dot { width: 24px; height: 24px; font-size: 12px; } }
.contrees { display: grid; gap: 14px; }
@media (min-width: 900px) { .contrees { grid-template-columns: 1fr 1fr 1fr; } }
.contree h2 { font-family: var(--f-display); font-weight: 400; color: var(--candle); margin: 0 0 8px; font-size: 20px; }
.contree .pin { width: 100%; margin-bottom: 8px; align-items: flex-start; }
.contree .pin:hover { transform: scale(1.02); }
/* lore : carnet d'enquête, lettres d'Augure, affaire finale, épilogue dialogué */
.lvl.carnet, .lvl.finalcase { min-height: 0; padding: 14px; }
.lvl.finalcase.locked { opacity: .8; cursor: default; }
.carnet-sec { margin: 0 0 22px; }
.carnet-sec h2 { font-family: var(--f-display); font-weight: 400; color: var(--candle); margin: 0 0 6px; }
.carnet-sec h2 small { font-family: var(--f-body); font-size: 14px; color: var(--muted); }
.lettres, .carnet-sec { display: grid; gap: 10px; }
@media (min-width: 900px) { .lettres { grid-template-columns: 1fr 1fr; } }
.lettre, .fiche { position: relative; isolation: isolate; padding: 12px 14px; color: var(--ink); --muted: #6e5434; }
.lettre::before, .fiche::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px; background: var(--parch-tex, none) center / 240px, linear-gradient(#f1e3c2, #e3cfa3); box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .5), 0 3px 8px rgba(0, 0, 0, .45); filter: url(#torn-s); }
.lettre p { font-style: italic; margin: 6px 0 2px; }
.lettre small, .fiche small { color: var(--muted); }
.lettre.locked { opacity: .55; }
.fiche { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.fiche .seal { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; }
.fiche p { margin: 4px 0 0; font-size: 14px; }
.fiche .gag { color: #a3312a; font-style: italic; }
.epi .epl { margin: 0 0 4px; }
.epi .epl.them { font-weight: 600; }
.letter-augure { margin: 10px 0; padding: 10px 12px; border: 1.5px dashed rgba(43, 32, 22, .5); border-radius: 4px; text-align: left; }
.letter-augure p { font-style: italic; margin: 4px 0; }
.letter-augure small { color: var(--muted); }
/* notation de la difficulté ressentie, sous la carte (votes envoyés au serveur : /note, journal nginx) */
.rate { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; border-radius: var(--radius); font-size: 14px; }
.rate .rates { display: inline-flex; gap: 6px; }
.ratebtn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 700 15px/1 var(--f-body); }
.ratebtn:hover { background: var(--board-2); }
.ratebtn[aria-pressed="true"] { background: #a3312a; border-color: #a3312a; color: #fbe7cf; }
.rate small { color: var(--muted); width: 100%; text-align: center; }

/* outils + personnages : collés en bas */
.dock {
  position: sticky; bottom: 0; z-index: 5;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(22, 17, 29, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.tools { display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; background: var(--board); border: 1px solid var(--line); border-radius: 99px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 99px; font-size: 14px; color: var(--muted); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--board-2); color: var(--fg); }
.tools .spacer { flex: 1; }
.tbtn .lbl { display: none; }
.hdtitle { display: none; } /* titre de l'affaire dans la barre du haut : ordinateur seulement */
.tbtn { border: 1px solid var(--line); background: var(--board); border-radius: 99px; min-width: 38px; height: 38px; padding: 0 10px; font-size: 15px; }
.tbtn:disabled { opacity: .4; }
.tbtn.pen .lbl { display: inline; }
.accuse { background: var(--candle); color: var(--candle-ink); border: 0; font-weight: 700; border-radius: 99px; height: 38px; padding: 0 14px; }
.accuse:disabled { background: var(--board-2); color: var(--muted); }
.tray { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tray::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--board);
  border-radius: 99px; padding: 4px 10px 4px 4px; min-height: 44px; font-size: 14px;
}
.chip .em { width: 34px; height: 34px; border-radius: 50%; background: #fff8e8; display: grid; place-items: center; font-size: 22px; line-height: 1; }
.chip.victim .em { background: #ffe9e4; box-shadow: 0 0 0 2px var(--blood); }
.chip[aria-pressed="true"] { border-color: var(--candle); box-shadow: 0 0 0 1px var(--candle) inset; }
.chip.placed { opacity: .5; }
.chip.placed[aria-pressed="true"] { opacity: 1; }

/* indices */
.clues { display: flex; flex-direction: column; gap: 8px; }
.clues h3, .sect { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; font-weight: 500; }
.clue {
  display: grid; grid-template-columns: 44px 1fr 36px; gap: 10px; align-items: start;
  background: var(--board); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px;
}
.clue .em { width: 44px; height: 44px; border-radius: 50%; background: #fff8e8; display: grid; place-items: center; font-size: 26px; border: 0; padding: 0; }
.clue.victim .em { background: #ffe9e4; box-shadow: 0 0 0 2px var(--blood); }
.clue .who { font-weight: 700; }
.clue .who small { font-weight: 400; color: var(--muted); font-style: italic; }
.clue .who .bigtag { font-weight: 600; font-size: 12px; color: var(--candle); white-space: nowrap; }
.lead-victim { color: var(--blood); }
.clue p { margin: 2px 0 0; min-width: 0; }
.clue .tick { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 16px; }
.clue.done, .clue.placed { opacity: .5; }
.clue.done p { text-decoration: line-through; text-decoration-color: var(--muted); }
.clue.done .tick { background: var(--board-2); color: var(--ok); }
.clue.violated { border-color: var(--blood); }
.clue.violated .tick { border-color: var(--blood); color: var(--blood); }
.clue.sel { border-color: var(--candle); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--board-2); border: 1px solid var(--line); color: var(--fg); padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: min(90vw, 420px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.toast.bad { border-color: var(--blood); }

/* fenêtres */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 5, 12, .7); display: grid; place-items: end center;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; background: var(--board); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; color: var(--candle); line-height: 1; }
.sheet p, .sheet li { margin: 0; font-size: 15px; }
.sheet ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.sheet .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.btn { border: 1px solid var(--line); background: var(--board-2); border-radius: 99px; padding: 10px 16px; min-height: 44px; }
.btn.primary { background: var(--candle); color: var(--candle-ink); border: 0; font-weight: 700; }
.objgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; font-size: 14px; }
.objgrid span { display: flex; gap: 6px; align-items: center; }
.objgrid em { width: 28px; height: 28px; flex: none; }
.objgrid .tag { font-size: 11px; color: var(--muted); }
.verdict { display: flex; align-items: center; gap: 12px; }
.verdictcard { background: var(--board); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.verdictcard p { margin: 0; }
.verdictcard .why { color: var(--muted); }
.verdictcard .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.boardwrap { position: relative; }

/* ---------- ordinateur : indices à gauche, carte et outils à droite ---------- */
.play { display: contents; } /* sur téléphone : une seule colonne, comme avant */
@media (min-width: 900px) and (hover: hover) {
  #app.game {
    max-width: 1440px; display: grid; gap: 14px 28px; align-items: start;
    grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
    grid-template-areas: "top top" "clues play";
  }
  #app.game > header.top { grid-area: top; }
  #app.game > .clues {
    grid-area: clues; position: sticky; top: 12px;
    max-height: calc(100vh - 24px); overflow-y: auto; overflow-x: hidden; padding: 4px 10px 8px 6px;
    scrollbar-width: thin; scrollbar-color: rgba(234, 217, 181, .25) transparent;
  }
  #app.game > .clues h3 { display: none; } /* carte, outils et indices alignés en haut */
  #app.game .casehead { display: none; }     /* titre déplacé dans la barre du haut */
  #app.game .hdtitle {
    display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px;
    font-family: var(--f-display); font-size: 24px; line-height: 1; color: var(--fg);
  }
  #app.game .hdtitle .skulls { font-family: var(--f-body); font-size: 15px; }
  #app.game .hdtitle:hover { color: var(--candle); }
  /* carte à gauche (toute la hauteur), outils puis règles spéciales dans une colonne à droite ;
     une fois l'affaire résolue, le verdict remplace les outils */
  #app.game > .play {
    grid-area: play; display: grid; gap: 14px 16px; align-items: start; justify-content: center;
    grid-template-columns: minmax(300px, calc(100vh - 110px)) 230px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "board tools" "board special" "rate special";
  }
  #app.game .boardwrap { grid-area: board; }
  #app.game .special { grid-area: special; }
  #app.game .rate { grid-area: rate; }
  #app.game .dock, #app.game .verdictcard { grid-area: tools; }
  #app.game .dock {
    position: relative; margin-inline: 0; padding: 10px; backdrop-filter: none; -webkit-backdrop-filter: none;
    background: var(--board); border: 1px solid var(--line); border-radius: var(--radius);
  }
  #app.game .tools { flex-direction: column; align-items: stretch; gap: 8px; }
  #app.game .tools .spacer { display: none; }
  #app.game .seg { flex-direction: column; border-radius: 12px; }
  #app.game .seg button { border-radius: 10px; }
  #app.game .tbtn, #app.game .accuse { width: 100%; height: 42px; border-radius: 12px; }
  #app.game .tbtn .lbl { display: inline; }
  #app.game .verdictcard .row { justify-content: stretch; }
  #app.game .verdictcard .row .btn { flex: 1; }
  /* on choisit un personnage en cliquant sur sa carte d'indice : la barre ferait doublon */
  #app.game .tray { display: none; }
  #app.game .clue { cursor: pointer; }
  #app.game .clue:hover { border-color: var(--muted); }
}
.stamp { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(22, 17, 29, .35); border-radius: 6px; }
.stamp span {
  font-family: var(--f-display); font-size: clamp(40px, 15vw, 72px); line-height: .9; text-align: center; color: var(--blood);
  border: 5px solid currentColor; border-radius: 12px; padding: 8px 18px; transform: rotate(-14deg);
  background: rgba(234, 217, 181, .88); box-shadow: 0 6px 24px rgba(0,0,0,.45); animation: stamp .35s cubic-bezier(.2, 1.6, .5, 1);
}
@keyframes stamp { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .stamp span { animation: none; } }
.token, .clue .em, .chip .em { position: relative; }
.letter {
  position: absolute; top: -3px; left: -3px; min-width: 15px; height: 15px; padding: 0 2px; border-radius: 99px;
  background: var(--cc, var(--ink)); color: #fff; font: 700 10px/15px var(--f-body); text-align: center; letter-spacing: 0;
}
.clue p b { color: var(--fg); }
.verdict .em { width: 64px; height: 64px; border-radius: 50%; background: #fff8e8; display: grid; place-items: center; font-size: 40px; box-shadow: 0 0 0 3px var(--blood); }
.verdict b { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--candle); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ================= habillage parchemin : fiches, outils, verdict, fenêtres =================
   Dans ces éléments, les couleurs de base passent de « clair sur nuit » à « encre sur parchemin » :
   les règles plus haut s'adaptent sans être réécrites. Le papier est dessiné par ::before (bords
   un peu déchirés par le filtre #torn-s), pour que le filtre ne touche pas le texte. */
.clue, .dock, .verdictcard, .special, .rate, .sheet, .chip, .case {
  --fg: var(--ink); --muted: #6e5434; --line: rgba(43, 32, 22, .38);
  --board: transparent; --board-2: rgba(43, 32, 22, .08); --red-ink: #a3312a; --sepia: #8a4b12;
  position: relative; isolation: isolate; color: var(--ink); background: transparent; border-color: transparent;
}
.clue::before, .dock::before, .verdictcard::before, .special::before, .rate::before, .sheet::before, .chip::before, .case::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
  background: var(--parch-tex, none) center / 240px, linear-gradient(#f1e3c2, #e3cfa3);
  box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .5), inset 0 0 12px rgba(120, 66, 18, .35), 0 3px 8px rgba(0, 0, 0, .45);
  filter: url(#torn-s);
}
.chip::before { border-radius: 99px; filter: none; }
.case { border: 0; }
.case:nth-child(odd) { transform: rotate(-.4deg); }
.case:nth-child(even) { transform: rotate(.3deg); }
.case:hover::before { box-shadow: inset 0 0 0 2px var(--candle), inset 0 0 12px rgba(120, 66, 18, .35), 0 6px 14px rgba(0, 0, 0, .5); }
/* fond : bureau d'enquêteur en bois sombre (texture « bureau ») ; sans texture, la nuit violette */
html, body { background: var(--desk-tex, none) center top / 640px, var(--night); }
/* fiches de suspect : posées un peu de travers ; la fiche choisie se redresse et se soulève */
.clue { border: 0; transition: transform .15s; }
.clue:nth-child(3n+1) { transform: rotate(-.7deg); }
.clue:nth-child(3n+2) { transform: rotate(.5deg); }
.clue:nth-child(3n) { transform: rotate(-.2deg); }
.clue.sel { transform: rotate(0) translateY(-2px); }
.clue.sel::before { box-shadow: inset 0 0 0 2px var(--candle), inset 0 0 12px rgba(120, 66, 18, .35), 0 0 0 2px rgba(240, 169, 58, .5), 0 8px 18px rgba(0, 0, 0, .55); }
.clue.violated::before { box-shadow: inset 0 0 0 2.5px var(--blood), inset 0 0 12px rgba(120, 66, 18, .35), 0 3px 8px rgba(0, 0, 0, .45); }
.clue .em, .chip .em { background: #fff8e8; box-shadow: 0 0 0 2px var(--ink); }
.clue.victim .em, .chip.victim .em { box-shadow: 0 0 0 2.5px var(--red-ink); }
.clue .who { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.05; }
.clue .who small { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.clue .who .bigtag { font-family: var(--f-body); color: var(--sepia); }
.clue p { color: var(--ink); }
/* mots-clés : soulignés à l'encre rouge, comme des annotations */
.clue p b { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--red-ink); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.clue p b.lead-victim, .lead-victim { color: var(--red-ink); text-decoration: none; }
/* case cochée à la plume ; indice exploité : fiche pâlie et tampon « Classé » */
.clue .tick { border: 1.5px solid var(--line); border-radius: 6px; color: transparent; font-weight: 700; transform: rotate(-3deg); }
.clue.done .tick { background: transparent; color: var(--red-ink); font-size: 22px; }
.clue.done p { text-decoration: none; }
.clue.done::after {
  content: "Classé"; position: absolute; right: 50px; bottom: 6px; transform: rotate(-10deg); pointer-events: none;
  font-family: var(--f-display); font-size: 16px; line-height: 1; color: var(--red-ink); border: 2px solid currentColor; border-radius: 4px; padding: 2px 6px; opacity: .8;
}
/* fiche d'un personnage placé ou d'un indice exploité : le papier reste opaque (un peu jauni), seul son contenu pâlit */
.clue.done, .clue.placed, .chip.placed { opacity: 1; }
.clue.done > *, .clue.placed > *, .chip.placed > * { opacity: .5; }
.clue.done::before, .clue.placed::before { background: var(--parch-tex, none) center / 240px, linear-gradient(#e4d2ab, #d4bd8f); }
.chip.placed::before { background: linear-gradient(#e4d2ab, #d4bd8f); }
/* étiquettes d'état de l'accueil : des tampons */
.case .state {
  background: transparent; border: 2px solid currentColor; border-radius: 4px; padding: 3px 8px; transform: rotate(-5deg);
  font-family: var(--f-display); font-size: 16px; letter-spacing: .04em; text-transform: none; color: var(--ink); opacity: .85;
}
.case .state.done { background: transparent; color: var(--red-ink); opacity: 1; }
.case .state.started { color: var(--sepia); }
/* boutons ronds du haut : médaillons de parchemin cerclés d'encre */
.iconbtn {
  border: 0; color: var(--ink); font-weight: 700;
  background: var(--parch-tex, none) center / 120px, radial-gradient(circle at 40% 35%, #f3e6c8, #dcc493);
  box-shadow: inset 0 0 0 2px rgba(43, 32, 22, .7), inset 0 0 8px rgba(120, 66, 18, .35), 0 3px 6px rgba(0, 0, 0, .45);
}
.iconbtn:hover { box-shadow: inset 0 0 0 2px var(--candle), inset 0 0 8px rgba(120, 66, 18, .35), 0 3px 6px rgba(0, 0, 0, .45); }
/* victime : cachet de cire rouge */
.clue.victim::after {
  content: "†"; position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; display: grid; place-items: center;
  font: 700 18px/1 var(--f-display); color: #f6d9c0; border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
  background: radial-gradient(circle at 35% 30%, #d4473b, #8e1f17 70%); box-shadow: inset 0 -2px 4px rgba(0, 0, 0, .35), 0 2px 4px rgba(0, 0, 0, .4);
}
/* outils */
.tbtn { background: transparent; border: 1.5px solid var(--line); color: var(--ink); border-radius: 8px; }
.tbtn:hover:not(:disabled) { background: var(--board-2); }
.tbtn.pen[aria-pressed="true"] { background: #2b2016; color: #f3e6c8; border-color: #2b2016; box-shadow: 0 0 0 2px rgba(240, 169, 58, .55); }
/* Accuser : un sceau de cire rouge */
.accuse {
  background: radial-gradient(circle at 35% 30%, #d4473b, #8e1f17 72%); color: #fbe7cf;
  font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .02em;
  border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%; box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .35), 0 3px 6px rgba(0, 0, 0, .4);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .35);
}
.accuse:disabled { background: radial-gradient(circle at 35% 30%, #b9a58a, #85735b 72%); color: #efe3cc; opacity: .7; }
.chip { border: 0; color: var(--ink); }
.chip[aria-pressed="true"]::before { box-shadow: inset 0 0 0 2px var(--candle), 0 0 0 2px rgba(240, 169, 58, .45); }
.chip[aria-pressed="true"] { box-shadow: none; }
.dock { border-top: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
.dock::before { border-radius: 0; }
.special b { color: var(--sepia); font-weight: 700; }
/* verdict : avis placardé « COUPABLE » */
.verdictcard { border: 0; text-align: center; align-items: center; }
.verdictcard .wanted { font-family: var(--f-display); font-size: 30px; line-height: 1; letter-spacing: .08em; color: var(--red-ink); text-transform: uppercase; }
.verdictcard .em.big { width: 96px; height: 96px; border-radius: 50%; position: relative; display: block; background: #fff8e8; box-shadow: 0 0 0 3px var(--red-ink), 0 0 0 7px rgba(163, 49, 42, .18); }
.verdictcard .culprit { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; }
.verdictcard .why { color: var(--muted); font-style: italic; }
.verdictcard .epi { text-align: left; }
.verdictcard .row { width: 100%; justify-content: center; }
.btn { color: var(--fg); }
.sheet .btn, .verdictcard .btn { background: transparent; border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); }
.sheet .btn.primary, .verdictcard .btn.primary {
  background: radial-gradient(circle at 35% 30%, #d4473b, #8e1f17 75%); color: #fbe7cf; border: 0;
  font-family: var(--f-display); font-weight: 400; font-size: 18px; box-shadow: inset 0 -2px 5px rgba(0, 0, 0, .3), 0 2px 5px rgba(0, 0, 0, .35);
}
.sheet { border: 0; border-radius: 3px; }
.sheet h2 { color: var(--red-ink); }
.toggle input { accent-color: var(--red-ink); }

/* ---------- affiche d'accueil ---------- */
.hero { position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: calc(100svh - 40px); }
.heroimg {
  position: relative; width: 100%; aspect-ratio: 1376 / 768; border-radius: 2px;
  background: var(--hero-wide, none) center / cover, #2a1f18;
}
/* cadre de parchemin déchiré DERRIÈRE l'image : un filtre SVG sur l'image elle-même la rendrait floue */
.heroimg::before {
  content: ""; position: absolute; z-index: -1; inset: -8px; border-radius: 3px;
  background: var(--parch-tex, none) center / 240px, linear-gradient(#efe0bd, #e0c99b);
  box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .5), 0 14px 34px rgba(0, 0, 0, .6);
  filter: url(#torn-s);
}
.herotitle { width: 100%; text-align: center; font-size: clamp(46px, 13vw, 64px); line-height: .9; color: var(--candle);
  text-shadow: 0 2px 0 #2b1405, 0 0 18px rgba(240, 169, 58, .35); -webkit-text-stroke: 1px #2b1405; paint-order: stroke fill; }
.herotitle small { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* lu par les lecteurs d'écran seulement */
.herobtn { height: auto; padding: 14px 44px; font-size: 30px; margin-top: 6px; }
@media (min-width: 700px) {
  .hero { margin-top: 8px; }
  /* le titre se pose sur les poutres, en haut de l'image */
  .herotitle { position: absolute; z-index: 1; top: 2.5%; left: 0; right: 0; font-size: clamp(64px, 9vw, 104px); }
  .herotitle .logo { width: min(58%, 600px) !important; }
  .herobtn { width: min(24vw, 240px) !important; }
  .herotitle::before { content: ""; position: absolute; z-index: -1; inset: -18% 10% -10%; background: radial-gradient(closest-side, rgba(15, 9, 5, .75), transparent); }
  /* le sceau à cheval sur le bas de l'affiche */
  .herobtn { margin-top: -42px; z-index: 2; }
}

/* ---------- page des niveaux et page d'un niveau ---------- */
.pagetitle { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1; margin: 0; color: var(--candle); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pagetitle .skulls { font-family: var(--f-body); font-size: 15px; }
.lead .lvlname { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--fg); }
.lead .count { white-space: nowrap; color: var(--candle); margin-left: 6px; }
.lvls { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 700px) { .lvls { grid-template-columns: repeat(3, 1fr); gap: 22px; } }
.lvl {
  --fg: var(--ink); --muted: #6e5434; --red-ink: #a3312a;
  position: relative; isolation: isolate; border: 0; background: transparent; color: var(--ink); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px 18px; min-height: 190px;
}
.lvl::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
  background: var(--parch-tex, none) center / 240px, linear-gradient(#f1e3c2, #e3cfa3);
  box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .5), inset 0 0 14px rgba(120, 66, 18, .4), 0 6px 14px rgba(0, 0, 0, .5);
  filter: url(#torn);
}
.lvl:nth-child(odd) { transform: rotate(-.8deg); }
.lvl:nth-child(even) { transform: rotate(.6deg); }
.lvl:hover::before { box-shadow: inset 0 0 0 2px var(--candle), inset 0 0 14px rgba(120, 66, 18, .4), 0 0 0 2px rgba(240, 169, 58, .45), 0 10px 20px rgba(0, 0, 0, .55); }
.lvl .skulls { font-size: 20px; filter: sepia(1) brightness(.5); }
.lvl b { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; }
.lvl .blurb { font-size: 15px; color: var(--ink); max-width: 30ch; }
.lvl .count { margin-top: auto; font-size: 13px; color: var(--muted); }
.lvldone {
  position: absolute; top: 14px; right: 10px; transform: rotate(10deg);
  font-family: var(--f-display); font-size: 17px; color: var(--red-ink); border: 2px solid currentColor; border-radius: 4px; padding: 1px 7px;
}
#app:not(.game) .cases { display: grid; gap: 10px; }
@media (min-width: 900px) { #app:not(.game) .cases { grid-template-columns: 1fr 1fr; } }

/* ---------- son, vignettes des niveaux, décors des enquêtes ---------- */
.herosound { position: absolute; top: 0; right: 0; z-index: 3; }
@media (min-width: 700px) { .herosound { top: 14px; right: 14px; } }
.lvlimg { width: 58%; max-width: 150px; aspect-ratio: 1; object-fit: contain; margin: -4px 0 -2px; filter: drop-shadow(0 3px 3px rgba(60, 30, 5, .35)); }
.lvl:hover .lvlimg { transform: rotate(-3deg) scale(1.05); transition: transform .2s; }
/* le bandeau en haut, la ligne portrait-titre-tampon prend toute la hauteur restante : une carte étirée par sa voisine
   (titre sur deux lignes) ne recentre pas son contenu (les navigateurs centrent le contenu d’un bouton), le bandeau ne bouge pas */
.case.has-decor { padding-top: 0; grid-template-rows: auto 1fr; align-content: stretch; row-gap: 10px; }
.case .decorimg {
  /* image collée sur le parchemin, à 6 px du bord : le bord déchiré (filtre #torn-s, ±3 px) ne la coupe jamais */
  grid-column: 1 / -1; height: 104px; margin: 6px -6px 0; border-radius: 2px;
  background-size: cover; background-position: center 40%; box-shadow: 0 0 0 1px rgba(43, 32, 22, .55), inset 0 -2px 0 rgba(43, 32, 22, .35);
}
.case.has-decor .seal { margin-top: -38px; box-shadow: 0 0 0 3px #efe0bd, 0 0 0 4px rgba(43, 32, 22, .6), 0 4px 8px rgba(0, 0, 0, .35); }

/* panneau du son : barre de volume */
.soundpop {
  position: fixed; z-index: 45; width: 220px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  --fg: var(--ink); --line: rgba(43, 32, 22, .38); color: var(--ink); isolation: isolate;
}
.soundpop::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
  background: var(--parch-tex, none) center / 240px, linear-gradient(#f1e3c2, #e3cfa3);
  box-shadow: inset 0 0 0 1.5px rgba(43, 32, 22, .5), inset 0 0 12px rgba(120, 66, 18, .35), 0 6px 16px rgba(0, 0, 0, .55);
  filter: url(#torn-s);
}
.soundpop label { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-display); font-size: 18px; }
.soundpop input[type=range] { width: 100%; accent-color: #a3312a; height: 28px; }
.soundpop .btn { background: transparent; border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); min-height: 38px; padding: 6px 10px; }
/*__FLOORS__*/

/* scènes du lore au centre de l'écran : intro, verdict, lettre d'Augure */
.overlay.center { place-items: center; padding: 16px; }
.story { max-width: 560px; text-align: center; align-items: center; animation: storyin .25s ease-out; }
@keyframes storyin { from { transform: translateY(14px) scale(.96); opacity: 0; } }

.lvl.carnet.unread::before { box-shadow: inset 0 0 0 3px #a3312a, 0 0 18px rgba(163, 49, 42, .6), 0 6px 14px rgba(0, 0, 0, .5); }
.lettre.fresh::before { box-shadow: inset 0 0 0 3px #a3312a, 0 3px 8px rgba(0, 0, 0, .45); }
/* ================= bureau de l'enquêteur ================= */
.bureau { position: relative; display: grid; gap: 16px; padding: 4px 0 24px; }
@media (min-width: 900px) { .bureau { grid-template-columns: minmax(0, 1fr) 230px; grid-template-areas: "map items" "places items"; align-items: start; column-gap: 28px; } .desk-map { grid-area: map; } .desk-places { grid-area: places; } .desk-items { grid-area: items; } }
.desk-map { position: relative; width: 100%; background: center / contain no-repeat; filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .6)); transform: rotate(-.6deg); z-index: 1; }
.pin-tl, .pin-tr { position: absolute; top: 3%; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e0574a, #8e1f17 70%); box-shadow: 0 3px 4px rgba(0, 0, 0, .5); z-index: 3; }

/* objets dessinés en attendant leurs illustrations (assets/desk/) */

.pile i { position: absolute; left: 10px; bottom: calc(8px + var(--i) * 7px); width: 108px; height: 64px; border-radius: 3px; background: linear-gradient(#d8b67a, #c49a5c); box-shadow: inset 0 0 0 1px rgba(80, 50, 20, .55), 0 3px 4px rgba(0, 0, 0, .45); transform: rotate(calc((var(--i) - 3) * 1.4deg)); }
.pile i::before { content: ""; position: absolute; top: -8px; left: 12px; width: 34px; height: 10px; border-radius: 3px 3px 0 0; background: #c49a5c; box-shadow: inset 0 0 0 1px rgba(80, 50, 20, .5); }
.pile i:last-child::after { content: "CLASSÉ"; position: absolute; right: 8px; bottom: 10px; padding: 1px 5px; border: 2px solid #a3312a; color: #a3312a; font: 400 13px/1 var(--f-display); transform: rotate(-8deg); }

.liasse.vide::after { display: none; }
.cuir { width: 90px; height: 116px; margin: 0 20px; border-radius: 6px 10px 10px 6px; background: radial-gradient(circle at 40% 30%, #8a5a32, #4e2f17 80%); box-shadow: inset 4px 0 0 rgba(0, 0, 0, .35), inset 0 0 0 2px rgba(30, 15, 5, .5), 0 6px 8px rgba(0, 0, 0, .5); transform: rotate(4deg); }
.cuir::after { content: ""; position: absolute; top: 46%; right: -6px; width: 26px; height: 12px; border-radius: 3px; background: #3a2210; box-shadow: 0 2px 2px rgba(0, 0, 0, .4); }
.env { width: 140px; height: 96px; border-radius: 3px; background: linear-gradient(150deg, transparent 49.5%, rgba(80, 50, 20, .3) 50%, transparent 51%), linear-gradient(30deg, transparent 49.5%, rgba(80, 50, 20, .3) 50%, transparent 51%), #f1e3c2; box-shadow: inset 0 0 0 1px rgba(80, 50, 20, .45), 0 8px 12px rgba(0, 0, 0, .55); transform: rotate(-5deg); }
.env::after { content: ""; position: absolute; left: 52px; top: 30px; width: 36px; height: 36px; border-radius: 47% 53% 50% 50%; background: radial-gradient(circle at 35% 30%, #4a4a4a, #111 70%); box-shadow: 0 2px 4px rgba(0, 0, 0, .6); }
.desk-item.enveloppe.fresh .env { animation: dotpulse 1.6s ease-in-out infinite; }
/* décor : les vignettes posées sur le bureau */
.desk-deco { position: absolute; z-index: 0; width: 120px; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .55)); opacity: .95; }
.desk-deco.d0 { left: -10px; top: -26px; width: 92px; transform: rotate(-12deg); }
.desk-deco.d1 { right: 250px; bottom: -40px; width: 110px; transform: rotate(14deg); }
.desk-deco.d2 { left: 30%; bottom: -50px; width: 100px; transform: rotate(-8deg); }
.desk-deco.d3, .desk-deco.d4, .desk-deco.d5 { display: none; }
@media (max-width: 899px) { .desk-deco.d1, .desk-deco.d2 { display: none; } .desk-deco.d0 { width: 70px; left: auto; right: 0; top: -20px; } }
/* prologue et fil rouge */
.story-img.map { height: 190px; background-size: contain; background-color: transparent; box-shadow: none; }
.story-text.aside { font-style: italic; color: var(--muted); }
.guide { text-align: left; align-self: stretch; margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
/* roue des personnages (appui long sur une case) */
.wheel-layer { position: fixed; inset: 0; z-index: 60; background: rgba(10, 6, 14, .35); }
.wheel { position: fixed; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(241, 227, 194, .97) 0 34%, rgba(241, 227, 194, .82) 35% 100%); box-shadow: inset 0 0 0 2px rgba(43, 32, 22, .6), 0 10px 30px rgba(0, 0, 0, .6); animation: wheelin .14s ease-out; }
@keyframes wheelin { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
.wheel-cell { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 13px/1 var(--f-body); color: #6e5434; }
.wheel-item { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: #fff8e8; box-shadow: 0 0 0 2px var(--ink), 0 3px 6px rgba(0, 0, 0, .4); cursor: pointer; display: grid; place-items: center; font-size: 26px; transition: transform .12s ease, box-shadow .12s ease; }
.wheel-item svg { width: 100%; height: 100%; border-radius: 50%; }
.wheel-item:hover, .wheel-item:focus-visible { transform: translate(-50%, -50%) scale(1.18); box-shadow: 0 0 0 3px var(--candle), 0 0 14px rgba(240, 169, 58, .9); outline: none; z-index: 2; }
.wheel-item.sel { box-shadow: 0 0 0 3px var(--candle), 0 0 12px rgba(240, 169, 58, .8); }
.wheel-item.victim { box-shadow: 0 0 0 2.5px var(--blood), 0 3px 6px rgba(0, 0, 0, .4); }
.wheel-item.placed { opacity: .6; }
/* ================= survol et sélection plus visibles (demande de François, 2026-10-18) ================= */
/* personnage choisi : sa fiche se soulève avec un halo doré, son médaillon prend un anneau doré, les autres s'estompent */
.clue, .chip, .token { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, filter .15s ease; }
.clues.has-sel .clue:not(.sel) { opacity: .55; filter: saturate(.7); }

  /* carte : la case sous la souris, et les pions */

<script>

<script>
const PUZZLES = /*__PUZZLES__*/;
const LORE = /*__LORE__*/; // bible du jeu : lettres d'Augure, troupe récurrente (noms, traits, tics)
const MEDIA = /*__MEDIA__*/; // fichiers servis à côté de la page : sons, vignettes des niveaux, décors
(function () {
  'use strict';
  const E = window.GrimEngine;
  const $app = document.getElementById('app');
  const $layer = document.getElementById('layer');
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('grimdoku:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('grimdoku:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const settings = Object.assign({ shade: true, live: false }, store.get('settings', {}));
  // difficulté sur 5 crânes (0 = initiation) ; le libellé sert aux lecteurs d'écran

  let P = null, ctx = null, S = null, undo = [], selected = null, toastT = null;

  // ---------- accueil ----------
  function caseHtml(p) {
    const st = store.get('p:' + p.id, null);
    const done = st && st.solved;
    const started = st && Object.keys(st.pos || {}).length;
    const v = p.characters.find(c => c.role === 'victim');
    const decor = MEDIA.decors.includes(p.decor) ? `<span class="decorimg" style="background-image:url(media/decor-${p.decor}.webp)"></span>` : '';
    return `<button class="case ${decor ? 'has-decor' : ''}" data-id="${p.id}">${decor}
          <span class="seal" aria-hidden="true">${face(v)}</span>
          <span><h3>${esc(p.title)}</h3><span class="meta">${p.size}×${p.size} · ${p.characters.length - 1} suspects</span></span>
          <span class="state ${done ? 'done' : started ? 'started' : ''}">${done ? 'Résolue' : started ? 'En cours' : 'Nouvelle'}</span>
        </button>`;
  }
  // ---------- le bureau de l'enquêteur (décision de François, 2026-10-18) ----------
  // Plus de classement par taille : « Jouer » mène (après le prologue) au bureau, avec la carte de Brumeval ouverte au
  // centre, les dossiers classés, les lettres anonymes, le carnet et un peu de décor. Au départ, seul le château est
  // ouvert ; chaque première enquête résolue dans un lieu apporte sa lettre, qui ouvre les lieux dont elle parle
  // (lore/carte.json, unlock). L'enveloppe de l'affaire finale n'apparaît qu'avec assez de lettres.
  const CASES = PUZZLES.filter(p => !p.final); // l'affaire finale n'est dans aucun lieu : elle arrive par l'enveloppe
  const FINAL = PUZZLES.find(p => p.final);
  const isSolved = (p) => !!(store.get('p:' + p.id, null) || {}).solved;
  const solvedIn = (list) => list.filter(isSolved).length;
  const placeCases = (pl) => CASES.filter(p => p.place === pl); // de la plus petite carte à la plus grande, puis la plus facile
  const pageHead = (backAria, title) => `
      <header class="top">
        <button class="iconbtn" id="back" aria-label="${backAria}">‹</button>
        <h1 class="pagetitle">${title}</h1>
        <span class="spacer"></span>
        ${soundBtn()}
        <button class="iconbtn" id="rulesBtn" aria-label="Règles">?</button>
      </header>`;
  // lieux ouverts : le départ, plus ceux qu'ouvre chaque lieu où une enquête est résolue
  function unlockedPlaces() {
    const open = new Set([LORE.start]);
    for (const p of CASES) if (isSolved(p)) { open.add(p.place); (LORE.unlock[p.place] || []).forEach(n => open.add(n)); }
    return open;
  }
  const seenPlaces = () => store.get('lieux-vus', []);
  // d'où l'on est entré dans une enquête (« lieu » ou « dossiers ») : ‹ y ramène
  let caseBack = 'lieu';

  function bureauPage() {
    P = null;
    $app.classList.remove('game');
    const open = unlockedPlaces(), seen = seenPlaces();
    const order = LORE.contrees.flatMap(c => c.lieux).filter(pl => placeCases(pl).length);
    const dot = (pl) => {
      if (!open.has(pl)) return `<span class="dot locked" style="--x:${LORE.pos[pl][0]}%;--y:${LORE.pos[pl][1]}%" aria-hidden="true">?</span>`;
      const list = placeCases(pl), done = solvedIn(list), fresh = !seen.includes(pl);
      return `<button class="dot ${done === list.length ? 'done' : ''} ${fresh ? 'fresh' : ''}" data-place="${pl}" style="--x:${LORE.pos[pl][0]}%;--y:${LORE.pos[pl][1]}%" aria-label="${esc(placeTitle(pl))}, ${done} sur ${list.length} résolues">
        ${done === list.length ? '✓' : fresh ? '!' : '•'}<span class="tip"><b>${esc(placeTitle(pl))}</b><small>${done} / ${list.length}${fresh ? ' · nouveau' : ''}</small></span></button>`;
    };
    const nSolved = solvedIn(CASES), got = letters(), nl = got.length, total = Object.keys(LORE.letters).length;
    const deco = (MEDIA.levels || []).filter(Boolean);
    const img = (k) => MEDIA.desk && MEDIA.desk[k] ? `<img class="desk-img" src="${MEDIA.desk[k]}" alt="">` : '';
    const sheets = Math.min(8, Math.max(1, Math.ceil(nSolved / 6)));
    $app.innerHTML = pageHead("Retour à l'accueil", "Bureau de l'enquêteur") + `
      <div class="bureau">
        ${deco.map((src, i) => `<img class="desk-deco d${i}" src="${src}" alt="" aria-hidden="true">`).join('')}
        <div class="desk-map" style="aspect-ratio:${LORE.ratio[0]} / ${LORE.ratio[1]};${MEDIA.map ? `background-image:url(${MEDIA.map})` : ''}">
          <span class="pin-tl" aria-hidden="true"></span><span class="pin-tr" aria-hidden="true"></span>
          ${order.map(dot).join('')}
        </div>
        <div class="desk-places">${order.filter(pl => open.has(pl)).map(pl => {
          const list = placeCases(pl), done = solvedIn(list);
          return `<button class="placechip ${done === list.length ? 'done' : ''} ${seen.includes(pl) ? '' : 'fresh'}" data-place="${pl}">${esc(placeTitle(pl))} <small>${done}/${list.length}</small></button>`;
        }).join('')}<span class="placechip locked">${order.length - order.filter(pl => open.has(pl)).length} lieux encore inconnus</span></div>
        <div class="desk-items">
          <button class="desk-item dossiers ${nSolved ? '' : 'vide'}" id="deskDossiers">${img('dossiers') || `<span class="pile">${Array.from({ length: sheets }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</span>`}
            <b>Dossiers classés</b><small>${nSolved} / ${CASES.length}</small></button>
          <button class="desk-item lettres ${unread() ? 'unread' : ''} ${nl ? '' : 'vide'}" id="deskLettres">${img('lettres') || `<span class="liasse ${nl ? '' : 'vide'}">${nl ? Array.from({ length: Math.min(5, nl) }, (_, i) => `<i style="--i:${i}"></i>`).join('') : '<i class="empty"></i>'}</span>`}
            <b>Lettres anonymes</b><small>${nl} / ${total}</small>${unread() ? `<span class="newmark">✉️ ${unread()} nouvelle${unread() > 1 ? 's' : ''}</span>` : ''}</button>
          <button class="desk-item carnet" id="deskCarnet">${img('carnet') || '<span class="cuir"></span>'}
            <b>Carnet d'enquête</b><small>la troupe de Brumeval</small></button>
          ${FINAL && finalUnlocked() ? `<button class="desk-item enveloppe ${isSolved(FINAL) ? '' : 'fresh'}" id="deskFinal">${img('enveloppe') || '<span class="env"></span>'}
            <b>Une enveloppe scellée</b><small>${isSolved(FINAL) ? 'Affaire classée' : esc(FINAL.title)}</small></button>` : ''}
        </div>
      </div>`;
    document.getElementById('back').onclick = () => go('');
    document.getElementById('rulesBtn').onclick = rules;
    $app.querySelectorAll('[data-place]').forEach(b => b.onclick = () => go('lieu/' + b.dataset.place));
    document.getElementById('deskDossiers').onclick = () => go('dossiers');
