<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registre des enquêtes</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Statistiques de Grimdoku (François, 2026-10-20 : « une page consultable pour les stats ») : lit en direct le compteur
   anonyme (journal, = logs/stats.log) et les votes de difficulté (notes, = logs/notes.log), derrière le mot de passe de
   la relecture (nginx, location /stats/). Rien n'est envoyé ailleurs ; heures de Paris. Données des grilles injectées
   par build-app.js (titre, lieu, taille, difficulté calculée : jamais de solution). */
:root {
  --bg: #16111d; --panel: #221a2c; --line: #3a2f47; --fg: #efe6d6; --muted: #a99bb8;
  --accent: #f0a93a; --accent2: #d9763a; --good: #7fb069; --bad: #d0605a; --bar: #f0a93a; --bar2: #8f7bb0;
  --paper: #f1e3c2; --ink: #2b2016;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 16px/1.45 "Alegreya Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif; background: var(--bg); }
main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
h1 { font: 400 40px/1 "Pirata One", Georgia, serif; color: var(--accent); margin: 0; }
h1 small { display: block; font: 400 15px/1.3 "Alegreya Sans", system-ui, sans-serif; color: var(--muted); margin-top: 6px; }
h2 { font: 400 24px/1.1 "Pirata One", Georgia, serif; color: var(--paper); margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.periods { display: flex; gap: 6px; flex-wrap: wrap; }
.periods button { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; }
.periods button[aria-pressed="true"] { background: var(--accent); color: #1d1408; border-color: var(--accent); font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi b { display: block; font: 400 34px/1.05 "Pirata One", Georgia, serif; color: var(--paper); font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.bars { display: flex; align-items: stretch; gap: 4px; height: 170px; border-bottom: 1px solid var(--line); padding-top: 4px; }
.bars .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; max-width: 64px; }
.bars .area { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.bars .area b { font-size: 12px; line-height: 1; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.bars .b { display: block; width: 100%; border-radius: 3px 3px 0 0; min-height: 0; }
.bars .b2 { position: absolute; bottom: 0; left: 30%; width: 40%; border-radius: 2px 2px 0 0; }
.bars small { height: 0; overflow: visible; text-align: center; color: var(--muted); font-size: 11px; white-space: nowrap; transform: translateY(4px); }
.bars + .legend, .card .bars { margin-bottom: 22px; }
.bars.many { gap: 2px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.funnel { display: grid; gap: 7px; }
.funnel div { display: grid; grid-template-columns: 170px 1fr 52px; align-items: center; gap: 10px; font-size: 14px; }
.funnel .track { height: 16px; background: #2d2338; border-radius: 4px; overflow: hidden; }
.funnel .fill { height: 100%; background: var(--bar); border-radius: 4px; }
.funnel em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 400; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th[aria-sort] { color: var(--accent); }
td.num, th.num { text-align: right; }
td.title { white-space: normal; min-width: 220px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; background: #3a2f47; color: var(--fg); }
.tag.bad { background: rgba(208, 96, 90, .25); color: #f0b0aa; }
.tag.good { background: rgba(127, 176, 105, .22); color: #bfe0ae; }
.empty { color: var(--muted); font-style: italic; }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
.err { background: rgba(208, 96, 90, .15); border: 1px solid var(--bad); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 32px; }
  .funnel div { grid-template-columns: 120px 1fr 44px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Registre des enquêtes<small id="span">Statistiques anonymes de Grimdoku</small></h1>
    <div class="periods" role="group" aria-label="Période">
      <button data-days="1">Aujourd'hui</button><button data-days="7">7 jours</button><button data-days="30">30 jours</button><button data-days="0">Tout</button>
    </div>
  </header>
  <div id="out"><p class="empty">Lecture des registres…</p></div>
  <p class="note">Joueur = appareil (numéro tiré au hasard, sans nom ni adresse). Les appareils ouverts une fois avec <code>?nostat</code> ne sont pas comptés. Heures de Paris.</p>
</main>
<script>
(function () {
  'use strict';
  const META = /*__META__*/{};
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const TZ = 'Europe/Paris';
  const fmt = (o) => new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: TZ }, o));
  const fDay = fmt({ year: 'numeric', month: '2-digit', day: '2-digit' }), fHour = fmt({ hour: '2-digit', hourCycle: 'h23' }),
    fWeek = fmt({ weekday: 'short' }), fShort = fmt({ day: 'numeric', month: 'short' }), fFull = fmt({ dateStyle: 'medium', timeStyle: 'short' });
  const dayKey = (d) => fDay.format(d).split('/').reverse().join('-');
  const hourOf = (d) => parseInt(fHour.format(d), 10);
  const placeOf = (g) => (META[g] && META[g].pl) || g.split('--')[0];
  const placeName = (pl) => { for (const m of Object.values(META)) if (m.pl === pl) return m.pn; return pl; };
  const pct = (a, b) => b ? Math.round(a * 100 / b) + ' %' : '–';

  // journaux nginx : « date e v g n x » (compteur ; x : n-ième indice, ce qui clochait, secondes de jeu) et « date g d v s n » (votes)
  function parseStats(txt) {
    const out = [];
    for (const line of txt.split('\n')) {
      const [t, e, v, g, n, x] = line.trim().split(' ');
      if (!t || !/^(visite|ouverte|resolue|indice|erreur)$/.test(e) || !/^[a-z0-9]{1,16}$/.test(v || '')) continue;
      const d = new Date(t); if (isNaN(d)) continue;
      out.push({ d, e, v, g: g && g !== '-' ? decodeURIComponent(g) : null, n: +n || null, x: x && x !== '-' ? decodeURIComponent(x) : null });
    }
    return out;
  }
  function parseNotes(txt) {
    const out = [];
    for (const line of txt.split('\n')) {
      const [t, g, dd, v, s] = line.trim().split(' ');
      if (!t || !g || g === 'test-claude' || !/^[0-5]$/.test(dd || '') || !v || v === '-') continue;
      const d = new Date(t); if (isNaN(d)) continue;
      out.push({ d, g: decodeURIComponent(g), note: +dd, v, s: s === '1' });
    }
    return out;
  }
  const get = (u) => fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.text() : r.status === 404 ? '' : Promise.reject(new Error(u + ' : ' + r.status)));

  let ALL = [], NOTES = [], days = 7, sort = { key: 'open', dir: -1 };

  // histogrammes en HTML (hauteur fixe, largeur souple), sans bibliothèque ; second : barre fine superposée
  function bars(values, labels, { color = 'var(--bar)', second = null, color2 = 'var(--bar2)', every = 1 } = {}) {
    const max = Math.max(1, ...values, ...(second || []));
    const many = values.length > 16;
    return `<div class="bars${many ? ' many' : ''}">${values.map((v, i) => `<div class="col" title="${esc(labels[i])} : ${v}${second ? ' (' + second[i] + ')' : ''}">
      <div class="area">${v ? `<b>${many ? '' : v}</b>` : ''}<span class="b" style="height:${v * 100 / max}%;background:${color}"></span>
      ${second && second[i] ? `<span class="b2" style="height:${second[i] * 100 / max}%;background:${color2}"></span>` : ''}</div>
      <small>${i % every === 0 ? esc(labels[i]) : ''}</small></div>`).join('')}</div>`;
  }

  function render() {
    const now = new Date(), today = dayKey(now);
    const from = days ? new Date(now.getTime() - (days - 1) * 864e5) : null;
    const inP = (x) => !from || dayKey(x.d) >= dayKey(from);
    const ev = ALL.filter(inP), notes = NOTES.filter(inP);
    $('#span').textContent = ALL.length
      ? `Statistiques anonymes de Grimdoku · dernier événement : ${fFull.format(ALL[ALL.length - 1].d)}`
      : 'Statistiques anonymes de Grimdoku';
    if (!ev.length && !notes.length) { $('#out').innerHTML = `<p class="empty">Aucun événement sur cette période${ALL.length ? '' : ' (le compteur n\'a encore rien reçu)'}.</p>`; return; }

    // joueurs : première apparition sur tout l'historique (pour « nouveaux »)
    const firstSeen = {};
    for (const x of ALL) if (!firstSeen[x.v]) firstSeen[x.v] = dayKey(x.d);
    const players = new Set(ev.map(x => x.v));
    const newP = [...players].filter(v => !from || firstSeen[v] >= dayKey(from));
    const by = {};
    for (const x of ev) {
      const o = by[x.v] = by[x.v] || { o: new Set(), r: new Set(), days: new Set() };
      o.days.add(dayKey(x.d)); if (x.e === 'ouverte' && x.g) o.o.add(x.g); if (x.e === 'resolue' && x.g) o.r.add(x.g);
    }
    const P = Object.values(by);
    const opens = ev.filter(x => x.e === 'ouverte').length, wins = ev.filter(x => x.e === 'resolue').length;
    const returning = [...players].filter(v => new Set(ALL.filter(x => x.v === v).map(x => dayKey(x.d))).size > 1).length;
    const todayP = new Set(ALL.filter(x => dayKey(x.d) === today).map(x => x.v)).size;
    const solvedPer = P.map(o => o.r.size).sort((a, b) => a - b);
    const median = solvedPer.length ? solvedPer[Math.floor(solvedPer.length / 2)] : 0;
    // indices demandés, accusations refusées, temps de jeu réel des affaires résolues (secondes, envoyé à la résolution)
    const hintsN = ev.filter(x => x.e === 'indice').length, errsN = ev.filter(x => x.e === 'erreur').length;
    const med = (a) => { const t = a.filter(x => x > 0).sort((p, q) => p - q); return t.length ? t[Math.floor(t.length / 2)] : null; };
    const mmss = (sec) => sec == null ? '–' : sec < 60 ? sec + ' s' : Math.floor(sec / 60) + ' min' + (sec % 60 >= 30 && sec < 600 ? ' ½' : '');
    const timeMed = med(ev.filter(x => x.e === 'resolue').map(x => +x.x));

    let html = `<section class="kpis">
      <div class="kpi"><b>${players.size}</b><span>joueurs uniques</span></div>
      <div class="kpi"><b>${newP.length}</b><span>nouveaux joueurs</span></div>
      <div class="kpi"><b>${todayP}</b><span>joueurs aujourd'hui</span></div>
      <div class="kpi"><b>${returning}</b><span>revenus un autre jour (${pct(returning, players.size)})</span></div>
      <div class="kpi"><b>${opens}</b><span>affaires ouvertes</span></div>
      <div class="kpi"><b>${wins}</b><span>affaires résolues (${pct(wins, opens)})</span></div>
      <div class="kpi"><b>${median}</b><span>résolues par joueur (médiane)</span></div>
      <div class="kpi"><b>${hintsN}</b><span>indices demandés</span></div>
      <div class="kpi"><b>${errsN}</b><span>accusations refusées</span></div>
      <div class="kpi"><b>${mmss(timeMed)}</b><span>temps de jeu par affaire (médiane)</span></div>
    </section><div class="grid">`;

    // par jour
    const dayList = [];
    const start = from || (ev[0] ? new Date(ev[0].d) : now);
    for (let d = new Date(start); dayKey(d) <= today; d = new Date(d.getTime() + 864e5)) if (!dayList.includes(dayKey(d))) dayList.push(dayKey(d));
    const active = dayList.map(k => new Set(ev.filter(x => dayKey(x.d) === k).map(x => x.v)).size);
    const fresh = dayList.map(k => newP.filter(v => firstSeen[v] === k).length);
    const winsDay = dayList.map(k => ev.filter(x => x.e === 'resolue' && dayKey(x.d) === k).length);
    const lab = dayList.map(k => fShort.format(new Date(k + 'T12:00:00')));
    const every = Math.ceil(dayList.length / 12);
    html += `<section class="card wide"><h2>Joueurs par jour</h2><p class="sub">Joueurs actifs et nouveaux joueurs.</p>
      ${bars(active, lab, { second: fresh, every })}
      <div class="legend"><span><i style="background:var(--bar)"></i>actifs</span><span><i style="background:var(--bar2)"></i>nouveaux</span></div></section>`;
    html += `<section class="card"><h2>Affaires résolues par jour</h2><p class="sub">${wins} sur la période.</p>${bars(winsDay, lab, { every, color: 'var(--good)' })}</section>`;

    // heures et jours de la semaine (un joueur compte une fois par heure)
    const h = Array(24).fill(0), seenH = new Set(), wd = Array(7).fill(0), seenW = new Set();
    const WD = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
    for (const x of ev) {
      const kh = x.v + dayKey(x.d) + hourOf(x.d); if (!seenH.has(kh)) { seenH.add(kh); h[hourOf(x.d)]++; }
      const kw = x.v + dayKey(x.d); if (!seenW.has(kw)) { seenW.add(kw); const i = WD.indexOf(fWeek.format(x.d)); if (i >= 0) wd[i]++; }
    }
    html += `<section class="card"><h2>Heures de jeu</h2><p class="sub">Joueurs actifs par heure (Paris).</p>${bars(h, h.map((_, i) => i + 'h'), { every: 3 })}</section>`;
    html += `<section class="card"><h2>Jours de la semaine</h2><p class="sub">Joueurs actifs par jour de la semaine.</p>${bars(wd, WD, { color: 'var(--bar2)' })}</section>`;

    // progression
    const steps = [['venus', players.size], ['ont ouvert une affaire', P.filter(o => o.o.size || o.r.size).length],
      ['en ont résolu 1', P.filter(o => o.r.size >= 1).length], ['5 ou plus', P.filter(o => o.r.size >= 5).length],
      ['15 ou plus', P.filter(o => o.r.size >= 15).length], ['50 ou plus', P.filter(o => o.r.size >= 50).length]];
    html += `<section class="card"><h2>Progression des joueurs</h2><p class="sub">Combien vont jusqu'où (affaires résolues sur la période).</p><div class="funnel">
      ${steps.map(([l, n]) => `<div><span>${l}</span><span class="track"><span class="fill" style="display:block;width:${players.size ? n * 100 / players.size : 0}%"></span></span><em>${n}</em></div>`).join('')}</div></section>`;

    // lieux
    const pl = {};
    for (const x of ev) if (x.g) {
      const o = pl[placeOf(x.g)] = pl[placeOf(x.g)] || { o: new Set(), r: new Set(), wins: 0 };
      if (x.e === 'ouverte') o.o.add(x.v); if (x.e === 'resolue') { o.r.add(x.v); o.wins++; }
    }
    const plRows = Object.entries(pl).sort((a, b) => b[1].o.size - a[1].o.size || b[1].wins - a[1].wins);
    html += `<section class="card wide"><h2>Lieux</h2><p class="sub">Joueurs venus enquêter dans chaque lieu.</p>${plRows.length ? `<div class="tablewrap"><table><thead><tr>
      <th>Lieu</th><th class="num">joueurs</th><th class="num">ont résolu</th><th class="num">résolutions</th></tr></thead><tbody>
      ${plRows.map(([k, o]) => `<tr><td>${esc(placeName(k))}</td><td class="num">${o.o.size}</td><td class="num">${o.r.size}</td><td class="num">${o.wins}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="empty">Aucune affaire ouverte.</p>'}</section>`;

    // affaires : ouvertures, résolutions, abandons, note ressentie (dernier vote de chaque joueur)
    const gr = {};
    const row = (g) => gr[g] = gr[g] || { g, o: new Set(), r: new Set(), notes: {}, hints: 0, errs: 0, times: [] };
    for (const x of ev) if (x.g) {
      const o = row(x.g);
      if (x.e === 'ouverte') o.o.add(x.v);
      if (x.e === 'resolue') { o.r.add(x.v); if (+x.x > 0) o.times.push(+x.x); }
      if (x.e === 'indice') o.hints++;
      if (x.e === 'erreur') o.errs++;
    }
    for (const x of notes) row(x.g).notes[x.v] = x.note;
    const rows = Object.values(gr).map(o => {
      const m = META[o.g] || {}, ns = Object.values(o.notes);
      const ab = [...o.o].filter(v => !o.r.has(v)).length;
      return { g: o.g, title: m.t || o.g, place: placeName(placeOf(o.g)), size: m.n || null, calc: m.d ?? null,
        open: o.o.size, win: o.r.size, ab, rate: o.o.size ? o.r.size / Math.max(o.o.size, o.r.size) : null,
        votes: ns.length, felt: ns.length ? ns.reduce((a, b) => a + b, 0) / ns.length : null,
        hints: o.hints, errs: o.errs, time: med(o.times) };
    });
    const COLS = [['title', 'Affaire'], ['place', 'Lieu'], ['size', 'Taille', 1], ['calc', 'Difficulté calculée', 1], ['open', 'Ouverte par', 1],
      ['win', 'Résolue par', 1], ['ab', 'Abandons', 1], ['rate', 'Réussite', 1], ['felt', 'Ressentie (0-5)', 1], ['votes', 'Votes', 1],
      ['hints', 'Indices', 1], ['errs', 'Accusations refusées', 1], ['time', 'Temps (médiane)', 1]];
    rows.sort((a, b) => { const x = a[sort.key], y = b[sort.key]; if (x === y) return a.title.localeCompare(b.title); if (x === null) return 1; if (y === null) return -1;
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sort.dir; });
    html += `<section class="card wide"><h2>Affaires</h2><p class="sub">Cliquer un en-tête pour trier. « Abandons » : joueurs qui l'ont ouverte sans la résoudre (pour l'instant).</p>
      ${rows.length ? `<div class="tablewrap"><table id="cases"><thead><tr>${COLS.map(([k, l, n]) => `<th data-k="${k}"${n ? ' class="num"' : ''}${sort.key === k ? ` aria-sort="${sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(r => `<tr><td class="title">${esc(r.title)}</td><td>${esc(r.place)}</td><td class="num">${r.size ? r.size + '×' + r.size : '–'}</td>
        <td class="num">${r.calc ?? '–'}</td><td class="num">${r.open}</td><td class="num">${r.win}</td>
        <td class="num">${r.ab ? `<span class="tag${r.ab >= 3 && r.ab > r.win ? ' bad' : ''}">${r.ab}</span>` : 0}</td>
        <td class="num">${r.rate === null ? '–' : `<span class="tag${r.rate >= .8 ? ' good' : r.rate < .5 && r.open >= 3 ? ' bad' : ''}">${Math.round(r.rate * 100)} %</span>`}</td>
        <td class="num">${r.felt === null ? '–' : r.felt.toFixed(1)}</td><td class="num">${r.votes}</td>
        <td class="num">${r.hints}</td><td class="num">${r.errs ? `<span class="tag${r.errs >= 3 ? ' bad' : ''}">${r.errs}</span>` : 0}</td><td class="num">${mmss(r.time)}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="empty">Aucune affaire ouverte.</p>'}</section>`;

    html += '</div>';
    $('#out').innerHTML = html;
    document.querySelectorAll('#cases th').forEach(th => th.onclick = () => {
      const k = th.dataset.k; sort = { key: k, dir: sort.key === k ? -sort.dir : (k === 'title' || k === 'place' ? 1 : -1) }; render();
    });
  }

  function setDays(n) {
    days = n;
    document.querySelectorAll('.periods button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.days === n)));
    try { localStorage.setItem('grimdoku-stats:jours', String(n)); } catch (e) { /* stockage bloqué */ }
    render();
  }
  document.querySelectorAll('.periods button').forEach(b => b.onclick = () => setDays(+b.dataset.days));
  let saved = 7;
  try { const s = localStorage.getItem('grimdoku-stats:jours'); if (s !== null && /^(0|1|7|30)$/.test(s)) saved = +s; } catch (e) { /* stockage bloqué */ }

  Promise.all([get('journal'), get('notes')]).then(([s, n]) => {
    ALL = parseStats(s).sort((a, b) => a.d - b.d);
    NOTES = parseNotes(n).sort((a, b) => a.d - b.d);
    setDays(saved);
  }).catch(err => { $('#out').innerHTML = `<div class="err">Impossible de lire les registres : ${esc(err.message)}</div>`; });
})();
</script>
